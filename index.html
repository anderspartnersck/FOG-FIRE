<title>FOG AND FIRE: THE LUNAR PACT</title>
<!-- ============================================================
     FOG AND FIRE: THE LUNAR PACT — a Castle Killscreen MECH FIGHTING GAME.
     Anders & Partners LLC · Joseph Coleman, First Partner. Tight canon to the FOG AND FIRE screenplays.
     North star: Gundam Wing; play model: Gundam Battle Assault / Street Fighter — 1v1 duels on a 2D plane,
     best of 3, chains, target combos, launchers, motion specials, one super per suit.
     The sim is lib/fight.js (deterministic, 60 Hz, seeded). The suits are 3D Blender builds (3D PIPELINE/
     games/fog-and-fire) drawn RENDER-ONLY from their atlases; nothing the renderer does touches the fight.
     The old squad wave game lives on as the bonus mode: waves.html.
     ============================================================ -->

<script>/* ?classic = the pre-1117 duel (frozen engine, fixed camera, old kits) until Joe signs off on the redesign */
document.write('<script src="lib/'+(/[?&]classic\b/.test(location.search)?'fight-classic':'fight')+'.js?v=2"><\/script>');</script>
<script src="lib/fafatlas.js?v=1"></script>
<script>
'use strict';
/* ============================ CORE ============================ */
const C=document.getElementById('c'),X=C.getContext('2d');
const W=960,H=540,F=FAFFight,GROUND=F.GROUND;
const CLASSIC=!F.isGiant;   // the frozen pre-1117 engine: shim the scale helpers the renderer asks for
if(CLASSIC){F.isGiant=()=>false;F.heightOf=f=>f.c.hurt[1]*(f.bigT>0?2:1);F.benchNext=()=>-1;}
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);C.style.width=((W*s)|0)+'px';C.style.height=((H*s)|0)+'px';}
addEventListener('resize',fit);fit();
const QS=new URLSearchParams(location.search||'');
const FONT=(px,b)=>(b?'bold ':'')+px+'px "Courier New",monospace';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let frame=0;

/* ============================ ASSETS (render-only) ============================ */
// The Pages bundle carries WebP copies in 3d/ (cut by the 3D pipeline); the master reads the pipeline's PNGs directly.
const BASES=/FOG(%20| )AND(%20| )FIRE\//.test(decodeURI(location.pathname)+location.pathname)?[['../3D%20PIPELINE/games/fog-and-fire/renders/','png'],['3d/renders/','webp']]:[['3d/renders/','webp'],['../3D%20PIPELINE/games/fog-and-fire/renders/','png']];
const IMGS={};
function img(rel){let im=IMGS[rel];if(im)return im;im=IMGS[rel]=new Image();im._ok=false;let i=0;
  const next=()=>{if(i>=BASES.length){im._bad=true;return;}const b=BASES[i++];im.src=b[0]+rel+'.'+b[1];};
  im.onload=()=>{im._ok=true;};im.onerror=next;next();return im;}
// FRAMES-52: new drawings may live on an extra atlas PAGE (index entry [col,row,page]; page 0 = the existing sheet, untouched;
// page n = <sid>_<pass>_1x_p<n+1>). A page loads the first time a frame on it is asked for.
const sheet=(sid,pass,pg)=>img('atlas/'+sid+'_'+pass+'_1x'+(pg?'_p'+(pg+1):''));
// 1117: the zoom camera draws the fighters from the 2x colour atlas, requested only for suits that are actually fighting
const LITE=QS.has('lite')||(navigator.deviceMemory&&navigator.deviceMemory<4);
const sheet2=(sid,pg)=>(!LITE&&FAF_ATLAS[sid]&&FAF_ATLAS[sid].r2)?img('atlas/'+sid+'_color_2x'+(pg?'_p'+(pg+1):'')):null;
// 1119: opt-in alternate atlases (ANGIE 1119 clip-fixed rebuild = ?angie=1119) load only when picked
const ALT_SID={angie1119_bk:QS.get('angie')==='1119'};
for(const sid in FAF_ATLAS){if(sid in ALT_SID&&!ALT_SID[sid])continue;sheet(sid,'color');sheet(sid,'glow');}
// the extra pages (FRAMES-52 drawings) load for the suits actually fighting, at the fight's start
function preloadPages(id){const L=LOOK[id];const A=L&&FAF_ATLAS[L.sid];if(!A)return;const pg=new Set();for(const n in A.frames)if(A.frames[n][2])pg.add(A.frames[n][2]);
  for(const p of pg){sheet(L.sid,'color',p);sheet(L.sid,'glow',p);sheet2(L.sid,p);}}
const STAGE_INFO={
  pod19:{name:'POD 19',sub:'over the pod · Phaser on the deck',sky:['#1a0e1e','#3a1430'],acc:'#ff5bc8'},
  newqom:{name:'NEW QOM',sub:'the spaceport outside the Imamate’s dome',sky:['#0a1428','#16305a'],acc:'#7fd0ff'},
  underhive:{name:'MARS UNDERHIVE',sub:'blue-collar depths',sky:['#0a0610','#1a0a1c'],acc:'#ff5bc8'},
  crawler:{name:'THE LUNAR CRAWLER',sub:'the squad’s mobile fortress',sky:['#05070d','#141a2a'],acc:'#9fb0bd'},
  ishtar:{name:'ISHTAR · VENUS',sub:'sulfur fog · the rebuild',sky:['#3a2e08','#6a5410'],acc:'#ffd24a'}};
// 1119: NEW QOM = the 1118 Atmodome + Air Command hangar plates (env_bk/newqom1118) by default; ?qom=1117 = the old in-the-wall plates
const PLATE_DIR={newqom:QS.get('qom')==='1117'?'newqom':'newqom1118'};
const plate=(t,L)=>img('env_bk/'+(PLATE_DIR[t]||t)+'/1x/'+L);
for(const t in STAGE_INFO)for(const L of ['far','mid','near'])plate(t,L);

// suit -> atlas + render tint. The Great Ones ride a squad model in their own colours until they get Blender builds
// (1125-52B: the Great Ones have their own Blender models, atlas sid = the plain id, e.g. deadletter; an <id>_bk build is
// also accepted. Either is used untinted; the old tinted squad look stays the fallback until the atlas syncs).
function own(id,base,tint){return FAF_ATLAS[id]?{sid:id}:FAF_ATLAS[id+'_bk']?{sid:id+'_bk'}:{sid:base,tint};}
const LOOK={sandtrap:{sid:'sandtrap_bk'},backdraft:{sid:'backdraft_bk'},holyroller:{sid:'holyroller_bk'},foxeylady:{sid:'foxeylady_bk'},
  poison:{sid:'poison_bk'},solitaire:{sid:'solitaire_bk'},namor:{sid:'namor_bk'},angie:{sid:(ALT_SID.angie1119_bk&&FAF_ATLAS.angie1119_bk)?'angie1119_bk':'angie_bk'},morningstar:{sid:'morningstar'},
  deadletter:own('deadletter','solitaire_bk',{col:'#5fd8ff',a:0.55,lift:0.18}),widow:own('widow','angie_bk',{col:'#d8f0c0',a:0.8,lift:0.12}),
  undertow:own('undertow','namor_bk',{col:'#14c4b0',a:0.75}),anvil:own('anvil','foxeylady_bk',{col:'#c08a22',a:0.75})};
const tmp=document.createElement('canvas'),tg=tmp.getContext('2d');const TINTC=new Map();
function sk(id){const L=LOOK[id]||LOOK.sandtrap,A=FAF_ATLAS[L.sid],c=F.CHARS[id];return A&&c?c.hurt[1]*1.12/A.vh:1;}
function drawCell(id,name,x,y,face,k,o){
  o=o||{};const L=LOOK[id]||LOOK.sandtrap,sid=L.sid,A=FAF_ATLAS[sid];if(!A)return false;k*=sk(id);
  const fr=A.frames[name]||A.frames[name.replace(/_d[12]_/,'_')]||A.frames[name.replace(/_\d+$/,'_0')]||A.frames.idle_0;
  const pg=fr[2]||0;let im=sheet(sid,'color',pg);if(!im._ok)return false;
  let cw=A.cell[0],ch=A.cell[1],ax=A.anchor[0],ay=A.anchor[1],sx=fr[0]*cw,sy=fr[1]*ch,k1=k;
  const g2=o.hi?sheet2(sid,pg):null;
  if(g2&&g2._ok){im=g2;cw=A.r2.cell[0];ch=A.r2.cell[1];ax=A.r2.anchor[0];ay=A.r2.anchor[1];sx=fr[0]*cw;sy=fr[1]*ch;k=k/2;}
  X.save();X.translate(x,y);X.scale(face,1);if(o.rot)X.rotate(o.rot);X.scale(k,k*(o.sy||1));if(o.alpha!=null)X.globalAlpha=o.alpha;
  X.imageSmoothingEnabled=true;
  const tint=L.tint,flash=o.flash||0;
  // PERF 1117 (HIGH TABLE docs/PERF-3D-RULES.md 5+6): a tinted look re-composed every cell every frame (resize tmp + 3-4
  // composite passes). A tinted, unflashed cell is now baked once per (look, sheet, frame) and blitted. Render-only.
  const tk=(tint&&!flash)?id+'|'+(im===g2?'h':'c')+pg+'|'+sx+','+sy+','+cw+','+ch:null,tc=tk&&TINTC.get(tk);
  if(tc)X.drawImage(tc,-ax,-ay);
  else if(tint||flash){if(tmp.width!==cw||tmp.height!==ch){tmp.width=cw;tmp.height=ch;}else{tg.globalCompositeOperation='source-over';tg.globalAlpha=1;tg.clearRect(0,0,cw,ch);}tg.drawImage(im,sx,sy,cw,ch,0,0,cw,ch);
    if(tint){tg.globalCompositeOperation='color';tg.globalAlpha=tint.a;tg.fillStyle=tint.col;tg.fillRect(0,0,cw,ch);
      if(tint.lift){tg.globalCompositeOperation='lighter';tg.globalAlpha=tint.lift;tg.fillRect(0,0,cw,ch);}}
    if(flash){tg.globalCompositeOperation='lighter';tg.globalAlpha=flash;tg.fillStyle=o.flashCol||'#fff';tg.fillRect(0,0,cw,ch);}
    tg.globalAlpha=1;tg.globalCompositeOperation='destination-in';tg.drawImage(im,sx,sy,cw,ch,0,0,cw,ch);tg.globalCompositeOperation='source-over';
    if(tk){if(TINTC.size>48)TINTC.clear();const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(tmp,0,0);TINTC.set(tk,c);}
    X.drawImage(tmp,-ax,-ay);}
  else X.drawImage(im,sx,sy,cw,ch,-ax,-ay,cw,ch);
  const g=sheet(sid,'glow',pg);if(g._ok&&o.glow!==false){if(k!==k1){X.scale(k1/k,k1/k);cw=A.cell[0];ch=A.cell[1];ax=A.anchor[0];ay=A.anchor[1];sx=fr[0]*cw;sy=fr[1]*ch;}
    X.globalCompositeOperation='lighter';X.globalAlpha=(o.alpha!=null?o.alpha:1)*0.85;X.drawImage(g,sx,sy,cw,ch,-ax,-ay,cw,ch);}
  X.restore();return true;}

/* ============================ AUDIO (tiny synth; CK BOOT: the first press on a blocked page only wakes it) ============================ */
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}return AC;}
if(window.CKBoot)CKBoot.onUnlock(()=>{const a=ac();if(a&&a.resume)a.resume();});
let MUTE=QS.has('mute');
function tone(f0,f1,dur,type,vol,delay){const a=ac();if(!a||a.state!=='running'||MUTE)return;const t=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol||0.08,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);}
function noise(dur,vol,lp){const a=ac();if(!a||a.state!=='running'||MUTE)return;const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=lp||1800;
  const g=a.createGain();g.gain.value=vol||0.2;s.connect(f);f.connect(g);g.connect(a.destination);s.start();}
const SFX={hit:l=>{noise(0.08+l*0.03,0.18+l*0.06,600+l*500);tone(180-l*25,50,0.12,'sine',0.12);},block:()=>{tone(1400,900,0.05,'square',0.04);noise(0.04,0.08,4000);},
  special:()=>tone(300,900,0.18,'sawtooth',0.05),super:()=>{tone(120,1200,0.5,'sawtooth',0.07);tone(240,2400,0.5,'square',0.03,0.05);},
  ko:()=>{noise(0.6,0.35,500);tone(90,30,0.7,'sine',0.2);},ui:()=>tone(660,880,0.05,'square',0.04),ok:()=>{tone(520,1040,0.08,'square',0.05);},
  throw:()=>{noise(0.15,0.3,400);tone(120,40,0.2,'sine',0.15);},jump:()=>tone(200,320,0.06,'triangle',0.03),parry:()=>{tone(1800,2400,0.12,'square',0.05);tone(900,1200,0.12,'square',0.04,0.04);},
  round:()=>{tone(440,440,0.12,'square',0.05);tone(660,660,0.18,'square',0.05,0.14);}};

/* ============================ INPUT ============================ */
const keys={};let anyPress=false;
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab','Backspace'].includes(e.code))e.preventDefault();
  if(window.CKBoot&&CKBoot.held())return;keys[e.code]=true;if(!e.repeat){anyPress=true;menuKey(e.code);}});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
// P1 = WASD + J K L (light medium heavy) + I (special) · U = throw (L+M) · O = super (S+H)
// P2 = ARROWS + Numpad 1 2 3 + Numpad 0 (alt , . / and ') · Numpad 4 throw · Numpad 6 super
// SOLO (P2 is the CPU): P1 may also use ARROWS + Z X C (L M H) + V (special) · B throw · N super
// TEAMS (1117): TAG = P1 Y · P2 Numpad 7 · solo M · pad RB      ASSIST = P1 H · P2 Numpad 8 · solo G · pad LT
const KB=[{l:['KeyA'],r:['KeyD'],u:['KeyW'],d:['KeyS'],L:['KeyJ'],M:['KeyK'],H:['KeyL'],S:['KeyI'],T:['KeyU'],SU:['KeyO'],G:['KeyY'],A:['KeyH']},
  {l:['ArrowLeft'],r:['ArrowRight'],u:['ArrowUp'],d:['ArrowDown'],L:['Numpad1','Comma'],M:['Numpad2','Period'],H:['Numpad3','Slash'],S:['Numpad0','Quote'],T:['Numpad4'],SU:['Numpad6'],G:['Numpad7'],A:['Numpad8']}];
const SOLO={l:['ArrowLeft'],r:['ArrowRight'],u:['ArrowUp'],d:['ArrowDown'],L:['KeyZ'],M:['KeyX'],H:['KeyC'],S:['KeyV'],T:['KeyB'],SU:['KeyN'],G:['KeyM'],A:['KeyG']};
function readMap(m,o){for(const k in m)if(m[k].some(c=>keys[c]))o[k]=true;return o;}
const PADS=[{},{}];
function padRead(i){let gp=null;try{const ps=navigator.getGamepads?navigator.getGamepads():[];let n=0;for(const p of ps){if(p){if(n===i){gp=p;break;}n++;}}}catch(e){}
  const o={};if(!gp)return o;const G=Ghost.read(gp),b=k=>Ghost.btn(gp,k);
  if(G.ax<-0.5)o.l=true;if(G.ax>0.5)o.r=true;if(G.ay<-0.5)o.u=true;if(G.ay>0.5)o.d=true;
  if(b(2))o.L=true;if(b(3))o.M=true;if(b(1))o.H=true;if(b(0))o.S=true;if(b(4))o.T=true;if(b(7))o.SU=true;if(b(5))o.G=true;if(b(6))o.A=true;if(b(9))o.START=true;o.present=true;return o;}
function sideInput(s,solo){const o={};readMap(KB[s],o);if(solo&&s===0)readMap(SOLO,o);if(s===0&&TOUCH.on)for(const k in TOUCH.o)if(TOUCH.o[k])o[k]=true;const p=padRead(s);for(const k in p)if(p[k])o[k]=true;
  if(o.T){o.L=true;o.M=true;}if(o.SU){o.S=true;o.H=true;}return o;}
// pads drive the menus too (edge-triggered into menuKey)
const padPrev=[{},{}];
function pollPadMenus(){for(let i=0;i<2;i++){const p=padRead(i);if(!p.present)continue;const pr=padPrev[i];
  const fire=(name,code,now)=>{if(now&&!pr[name]){if(!(window.CKBoot&&CKBoot.held())){anyPress=true;menuKey(code,i);}}pr[name]=now;};
  if(GS!=='fight'||paused){fire('l',i?'ArrowLeft':'KeyA',p.l);fire('r',i?'ArrowRight':'KeyD',p.r);fire('u',i?'ArrowUp':'KeyW',p.u);fire('d',i?'ArrowDown':'KeyS',p.d);
    fire('S',i?'Numpad1':'KeyJ',p.S);fire('H',i?'Escape':'Escape',p.H);}
  fire('START','Escape',p.START&&GS==='fight');fire('STARTm','Enter',p.START&&GS!=='fight');}}

/* ============================ PERSISTENCE (unlocks only) ============================ */
let SAVE=(()=>{try{return JSON.parse(localStorage.getItem('faf_duel'))||{};}catch(e){return {};}})();
function save(){try{localStorage.setItem('faf_duel',JSON.stringify(SAVE));}catch(e){}}
if(QS.has('unlock'))SAVE.clear=1;
const locked=id=>!!F.CHARS[id].lock&&!SAVE.clear;

/* ============================ STATE ============================ */
let GS=QS.has('noboot')?'title':'boot',bootT=0,idleT=0,endT=0,paused=false,pauseI=0,pauseSub='';
const ATTRACT_F=(QS.has('attract')&&QS.get('attract')!==''?+QS.get('attract'):25)*60; // ?attract=0 turns the title demo off
const DIFFS=['EASY','NORMAL','HARD','HARDEST'];let diff=+(QS.get('cpu')||1);
const MENU=CLASSIC?['ARCADE','VERSUS CPU','VERSUS 2P','TRAINING','MOVE LIST','SQUAD WAVES (BONUS)','HOW TO PLAY']:['ARCADE','VERSUS CPU','VERSUS 2P','TRAINING','TAG 2 v 2','TAG 3 v 3','BOSS RAID — MORNINGSTAR','MOVE LIST','SQUAD WAVES (BONUS)','HOW TO PLAY'];let menuI=0;
let mode='versus',sel=null,stageSel=0,M=null,cfg=null,ARC=null,DEMO=false,demoT=0,resultI=0;
let mlId='sandtrap',mlPage=0,howFrom='menu',mlFrom='menu';
const TR={hit:QS.has('hitbox'),dummy:'stand',inf:true,fd:true,hist:[],lastIn:'',last:null};
const DUMMIES=['stand','crouch','jump','block','cpu'];
if(window.CKBoot&&GS==='boot')CKBoot.hold(Infinity);

/* ============================ FLOW ============================ */
function toTitle(){GS='title';idleT=0;DEMO=false;paused=false;if(M&&M.setPaused)M.setPaused(false);}
function startDemo(){const pool=F.ROSTER.slice(0,8),r=Math.random;const a=pool[(r()*8)|0];let b=pool[(r()*8)|0];if(b===a)b=pool[(pool.indexOf(a)+3)%8];
  DEMO=true;demoT=0;startFight({mode:'demo',p1:a,p2:b,stage:F.STAGES[(r()*5)|0],cpu:[true,true],lvl:[2,2],seed:(r()*1e6)|0});}
function startFight(c){cfg=c;M=F.match({p1:c.p1,p2:c.p2,team1:c.team1,team2:c.team2,seed:c.seed||((Math.random()*1e9)|0),training:c.mode==='training',infMeter:c.mode==='training'&&TR.inf});
  GS='fight';paused=false;M.setPaused&&M.setPaused(false);LATCH[0]={};LATCH[1]={};endT=0;FX.length=0;CAM.snap=true;BAN.length=0;shake=0;R0.clear&&R0.clear();RM.length=0;TR.hist.length=0;TR.last=null;OBR.hit=-1;OBR.words.length=0;
  for(const id of new Set([].concat(c.team1||[c.p1],c.team2||[c.p2])))preloadPages(id);
  if(c.mode==='training')resetTraining();}
function resetTraining(){const E=M.E;E.f[0].x=W/2-120;E.f[1].x=W/2+120;for(const f of E.f){f.y=GROUND;f.vx=f.vy=0;f.hp=f.maxhp;f.move=null;f.mkey='';f.state='stand';f.hitstun=f.blockstun=f.kd=0;f.airHit=false;f.juggle=0;f.juggleFull=false;f.bigT=0;}E.projs.length=0;E.zones.length=0;E.f[0].face=1;E.f[1].face=-1;}
function newSel(m,size){mode=m;sel={step:0,cur:[0,1],pick:[null,null],ready:[false,false],stage:-1,who:0,size:size||0,team:[[],[]]};
  if(m==='raid')sel.team[1]=['morningstar'];
  if(m==='versus2p')sel.cur=[0,1];GS='select';}
function beginFromSelect(){const st=sel.stage<0?F.STAGES[(Math.random()*5)|0]:F.STAGES[sel.stage];
  if(mode==='arcade'){startArcade(sel.pick[0]);return;}
  if(sel.size){startFight({mode:mode,team1:sel.team[0],team2:sel.team[1],stage:st,cpu:[false,true],lvl:[diff,diff]});return;}
  startFight({mode:mode==='training'?'training':'versus',p1:sel.pick[0],p2:sel.pick[1],stage:st,cpu:[false,mode==='versus'],lvl:[diff,diff],two:mode==='versus2p'});}
function startArcade(suit){const pool=F.ROSTER.slice(0,8).filter(x=>x!==suit);let s=(Math.random()*1e9)|0;
  const R=()=>(s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296;for(let i=pool.length-1;i>0;i--){const j=(R()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]];}
  ARC={suit,rung:0,autos:pool,base:diff,cont:0};GS='vs';endT=0;}
function arcFoe(){const r=F.LADDER[ARC.rung];return r.foe.startsWith('auto')?ARC.autos[+r.foe.slice(4)]:r.foe;}
function arcFight(){const r=F.LADDER[ARC.rung],lv=clamp(ARC.base+(ARC.rung>=3?1:0)+(ARC.rung===7?1:0),0,3);
  startFight({mode:'arcade',p1:ARC.suit,p2:arcFoe(),stage:r.stage,cpu:[false,true],lvl:[lv,lv]});}
function onMatchOver(){
  if(cfg.mode==='demo'){toTitle();return;}
  GS='results';endT=0;resultI=0;if(window.CKBoot)CKBoot.hold(900);}

/* ============================ MENU KEYS ============================ */
const isUp=c=>c==='ArrowUp'||c==='KeyW',isDn=c=>c==='ArrowDown'||c==='KeyS',isL=c=>c==='ArrowLeft'||c==='KeyA',isR=c=>c==='ArrowRight'||c==='KeyD';
const isOk=c=>c==='Enter'||c==='Space'||c==='KeyJ'||c==='KeyZ'||c==='Numpad1'||c==='Comma',isBack=c=>c==='Escape'||c==='Backspace';
function menuKey(code,pad){
  idleT=0;
  if(GS==='boot')return;                                         // CK BOOT STANDARD: the ident plays out
  if(DEMO){DEMO=false;toTitle();return;}                            // any press ends the attract demo -> the title
  if(GS==='title'){if(isOk(code)||code==='Enter'){GS='menu';SFX.ok();}return;}
  if(GS==='menu'){
    if(isUp(code)){menuI=(menuI+MENU.length-1)%MENU.length;SFX.ui();}
    else if(isDn(code)){menuI=(menuI+1)%MENU.length;SFX.ui();}
    else if(isL(code)&&MENU[menuI]&&!/MOVE|SQUAD|HOW/.test(MENU[menuI])){diff=(diff+3)%4;SFX.ui();}else if(isR(code)&&MENU[menuI]&&!/MOVE|SQUAD|HOW/.test(MENU[menuI])){diff=(diff+1)%4;SFX.ui();}
    else if(isBack(code))toTitle();
    else if(isOk(code)){SFX.ok();const it=MENU[menuI];
      if(it==='ARCADE')newSel('arcade');else if(it==='VERSUS CPU')newSel('versus');else if(it==='VERSUS 2P')newSel('versus2p');
      else if(it==='TRAINING')newSel('training');else if(it==='TAG 2 v 2')newSel('tag',2);else if(it==='TAG 3 v 3')newSel('tag',3);else if(it.startsWith('BOSS RAID'))newSel('raid',3);else if(it==='MOVE LIST'){mlFrom='menu';mlPage=0;GS='movelist';}
      else if(it==='HOW TO PLAY'){howFrom='menu';GS='howto';}
      else if(it.startsWith('SQUAD WAVES'))location.href='waves.html'+(QS.get('from')?'?from='+QS.get('from'):'');}
    return;}
  if(GS==='howto'){if(isBack(code)||isOk(code)){GS=howFrom==='pause'?'fight':'menu';}return;}                  // back into the (still paused) duel
  if(GS==='movelist'){const ids=mlFrom==='pause'&&M?fightIds():F.ROSTER,np=mlPages(F.movelist(mlId),ML_CAP).length;
    if(isL(code)){mlId=ids[(ids.indexOf(mlId)+ids.length-1)%ids.length];mlPage=0;SFX.ui();}
    else if(isR(code)){mlId=ids[(ids.indexOf(mlId)+1)%ids.length];mlPage=0;SFX.ui();}
    else if(isUp(code)){if(mlPage>0){mlPage--;SFX.ui();}}else if(isDn(code)){if(mlPage<np-1){mlPage++;SFX.ui();}}
    else if(isBack(code)||isOk(code)){GS=mlFrom==='pause'?'fight':'menu';}                                        // from pause: back to the pause menu
    return;}
  if(GS==='select'){selectKey(code);return;}
  if(GS==='vs'){if(endT>40&&(isOk(code)||code==='Enter'))arcFight();else if(isBack(code)&&endT>40)toTitle();return;}
  if(GS==='fight'){
    if(paused){pauseKey(code);return;}
    if(code==='Escape'||code==='KeyP'){setPause(true,pad===1?1:0);pauseSub='';SFX.ui();return;}
    if(cfg.mode==='training'){if(code==='Tab')TR.hit=!TR.hit;if(code==='KeyR'||code==='Backspace')resetTraining();if(code==='KeyT')TR.dummy=DUMMIES[(DUMMIES.indexOf(TR.dummy)+1)%DUMMIES.length];}
    return;}
  if(GS==='results'){if(window.CKBoot&&CKBoot.held())return;if(endT<54)return;                         // CK BOOT: ~0.9 s results hold
    const opts=resultOpts();
    if(isUp(code))resultI=(resultI+opts.length-1)%opts.length;else if(isDn(code))resultI=(resultI+1)%opts.length;
    else if(isOk(code)){SFX.ok();doResult(opts[resultI]);}else if(isBack(code))toTitle();return;}
  if(GS==='ending'){if(endT>120&&(isOk(code)||isBack(code)))toTitle();return;}
}
function resultOpts(){
  if(cfg.mode==='arcade'){const won=M.winner===0;if(won)return ARC.rung+1>=F.LADDER.length?['THE END']:['NEXT DUEL','QUIT TO TITLE'];return ['CONTINUE','QUIT TO TITLE'];}
  return ['REMATCH','CHARACTER SELECT','MAIN MENU'];}
function doResult(o){
  if(o==='NEXT DUEL'){ARC.rung++;GS='vs';endT=0;}
  else if(o==='THE END'){SAVE.clear=1;if(ARC.base>=3)SAVE.hardest=1;save();GS='ending';endT=0;}
  else if(o==='CONTINUE'){ARC.cont++;GS='vs';endT=0;}
  else if(o==='REMATCH')startFight(Object.assign({},cfg,{seed:0}));
  else if(o==='CHARACTER SELECT')newSel(mode);
  else if(o==='MAIN MENU'){GS='menu';}else toTitle();}

/* ---- character select ---- */
const GRID_COLS=7;
function selectKey(code){
  const ids=F.ROSTER,n=ids.length,two=mode==='versus2p';
  if(sel.step===2){                                            // the stage
    if(sel.size&&isBack(code)){sel.step=0;sel.team[sel.who].pop();return;}
    if(isL(code)||code==='ArrowLeft'){sel.stage=sel.stage<=-1?4:sel.stage-1;SFX.ui();}
    else if(isR(code)||code==='ArrowRight'){sel.stage=sel.stage>=4?-1:sel.stage+1;SFX.ui();}
    else if(isOk(code)){SFX.ok();beginFromSelect();}
    else if(isBack(code)){sel.step=1;sel.pick[1]=null;sel.ready[1]=false;if(two){sel.ready=[false,false];sel.step=0;}}
    return;}
  // which cursor does this key move?
  const p2key=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Numpad1','Comma','Enter'].includes(code);
  let who=two?(p2key?1:0):sel.who;
  if(two&&sel.ready[who]&&!isBack(code))return;
  const mv=(d)=>{sel.cur[who]=(sel.cur[who]+d+n)%n;SFX.ui();};
  const h=two?(who?{l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown'}:{l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS'}):null;
  const L_=two?code===h.l:isL(code),R_=two?code===h.r:isR(code),U_=two?code===h.u:isUp(code),D_=two?code===h.d:isDn(code);
  if(L_)mv(-1);else if(R_)mv(1);else if(U_)mv(-GRID_COLS);else if(D_)mv(GRID_COLS);
  else if((two&&((who===0&&(code==='KeyJ'||code==='Space'))||(who===1&&(code==='Numpad1'||code==='Comma'||code==='Enter'))))||(!two&&isOk(code))){
    const id=ids[sel.cur[who]];if(locked(id)){SFX.block();return;}SFX.ok();
    if(two){sel.pick[who]=id;sel.ready[who]=true;if(sel.ready[0]&&sel.ready[1])sel.step=2;return;}
    if(sel.size){const T=sel.team[sel.who];if(T.includes(id)){SFX.block();return;}T.push(id);sel.pick[sel.who]=id;
      if(T.length>=sel.size){if(sel.who===0&&mode!=='raid'){sel.who=1;sel.cur[1]=(sel.cur[0]+1)%8;}else sel.step=2;}return;}
    sel.pick[sel.who]=id;
    if(mode==='arcade'){beginFromSelect();return;}
    if(sel.who===0){sel.who=1;sel.cur[1]=(sel.cur[0]+1)%8;}else sel.step=2;}
  else if(isBack(code)){
    if(two){if(sel.ready[who]){sel.ready[who]=false;sel.pick[who]=null;}else GS='menu';return;}
    if(sel.size){const T=sel.team[sel.who];if(T.length&&!(mode==='raid'&&sel.who===1))T.pop();else if(sel.who===1&&mode!=='raid'){sel.who=0;sel.team[0].pop();}else GS='menu';return;}
    if(sel.who===1){sel.who=0;sel.pick[0]=null;}else GS='menu';}
  else if(code==='KeyQ'||code==='KeyR'&&!two){/* random */let k=(Math.random()*8)|0;sel.cur[who]=k;SFX.ui();}
}

/* ---- pause (52): RESUME · MOVE LIST · HOW TO PLAY · the training toggles · CHARACTER SELECT · MAIN MENU · QUIT TO TITLE.
   Start / Esc / P / pad START opens it in any duel (1P, 2P, CPU, teams, during the Obliteration window). The sim is frozen
   by not stepping it AND by M.setPaused (a paused match ignores step calls), so a pause can never change a replay; on
   resume every button still held from the menu is latched until released, so the press that picked RESUME is not a jab. ---- */
const LATCH=[{},{}];let pauseBy=0;
function setPause(on,by){paused=!!on;if(M&&M.setPaused)M.setPaused(paused);if(on){pauseBy=by||0;pauseI=0;}
  else if(cfg&&GS==='fight')for(let s=0;s<2;s++){LATCH[s]={};const o=sideInput(s,!cfg.two&&s===0);for(const k of ['L','M','H','S','G','A'])if(o[k])LATCH[s][k]=true;}}
function unlatch(s,o){const L=LATCH[s];for(const k in L){if(o[k])delete o[k];else delete L[k];}return o;}
function pauseItems(){const t=cfg.mode==='training';const a=['RESUME','MOVE LIST','HOW TO PLAY'];
  if(t)a.push('HITBOXES: '+(TR.hit?'ON':'OFF'),'DUMMY: '+TR.dummy.toUpperCase(),'METER: '+(TR.inf?'INFINITE':'NORMAL'),'FRAME DATA: '+(TR.fd?'ON':'OFF'),'RESET POSITIONS');
  a.push('CHARACTER SELECT','MAIN MENU','QUIT TO TITLE');if(QS.get('from')==='keep')a.push('QUIT TO ARCADE');return a;}
// the move list opened from pause pages through the suits in THIS fight (both sides, whole teams), starting with the pauser's
function fightIds(){const E=M.E;const a=E.team?E.team[pauseBy].ids.concat(E.team[1-pauseBy].ids):[E.f[pauseBy].id,E.f[1-pauseBy].id];return [...new Set(a)];}
function pauseKey(code){const it=pauseItems();
  if(isUp(code)){pauseI=(pauseI+it.length-1)%it.length;SFX.ui();}else if(isDn(code)){pauseI=(pauseI+1)%it.length;SFX.ui();}
  else if(code==='Escape'||code==='KeyP')setPause(false);
  else if(isOk(code)){const s=it[pauseI];SFX.ok();
    if(s==='RESUME')setPause(false);else if(s==='MOVE LIST'){mlFrom='pause';mlId=fightIds()[0];mlPage=0;GS='movelist';}
    else if(s==='HOW TO PLAY'){howFrom='pause';GS='howto';}
    else if(s.startsWith('HITBOXES'))TR.hit=!TR.hit;else if(s.startsWith('DUMMY'))TR.dummy=DUMMIES[(DUMMIES.indexOf(TR.dummy)+1)%DUMMIES.length];
    else if(s.startsWith('METER')){TR.inf=!TR.inf;M.E.infMeter=TR.inf;}else if(s.startsWith('FRAME'))TR.fd=!TR.fd;
    else if(s==='RESET POSITIONS'){resetTraining();setPause(false);}
    else if(s==='CHARACTER SELECT'){paused=false;newSel(mode==='arcade'?'arcade':mode);}
    else if(s==='MAIN MENU'){paused=false;GS='menu';}
    else if(s==='QUIT TO TITLE')toTitle();else if(s==='QUIT TO ARCADE')location.href="../COLEMAN'S KEEP.html";}}

/* ============================ FX (render-only) ============================ */
const FX=[],BAN=[];let shake=0,flashW=0;const R0=new Map();const RM=[];const OBR={hit:-1,words:[]};
function spark(x,y,col,n,sp,life){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(0.4+Math.random())*sp;FX.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:life||18,max:life||18,col,sz:2+Math.random()*3});}}
function ring(x,y,col,r){FX.push({ring:1,x,y,r:4,max:r,life:14,col});}
function banner(text,side,col,big,life){BAN.push({text,side,col:col||'#fff',big:!!big,life:life||70,max:life||70});}
function rmem(f){let r=R0.get(f);if(!r){r={flash:0,koT:0,boostT:0,jumps:0,face:f.face,turn:0,lastHp:f.hp,red:f.hp,redT:0};R0.set(f,r);}return r;}
function onEvents(ev){
  for(const e of ev){const f=e.f;
    switch(e.k){
      case 'hit':{const l=e.lvl||1;spark(e.x,e.y,l>=4?'#ffd24a':l>=3?'#ffb04a':'#fff2c8',5+l*3,3+l*1.1,14+l*2);ring(e.x,e.y,'#fff',12+l*7);shake=Math.max(shake,2+l*1.6);rmem(f).flash=0.9;SFX.hit(l);
        if(e.counter)banner('COUNTER',e.by.side,'#ff5b6b',false,50);break;}
      case 'block':spark(e.x,e.y,'#7fd0ff',8,2.5,12);ring(e.x,e.y,'#7fd0ff',26);SFX.block();break;
      case 'special':banner(e.name,f.side,f.c.color,false,70);SFX.special();break;
      case 'super':flashW=1;SFX.super();RM.push({k:'cut',f,t:0});break;
      case 'tc':banner(e.name,f.side,'#cfd6e0',false,50);break;
      case 'throw':spark(e.x,e.y,'#fff',18,4,20);shake=8;banner(e.name||'THROW',e.by.side,'#fff',false,60);SFX.throw();break;
      case 'tech':spark(e.x,e.y,'#7fd0ff',14,3,16);banner('TECH!',f.side,'#7fd0ff',false,50);SFX.parry();break;
      case 'parry':spark(e.x,e.y,'#ffffff',24,5,24);ring(e.x,e.y,'#e8c878',60);banner(e.name,f.side,'#e8c878',true,80);shake=10;SFX.parry();break;
      case 'redirect':spark(e.x,e.y,'#7fd0ff',16,3,18);banner('REDIRECT',f.side,'#7fd0ff',false,60);SFX.parry();break;
      case 'armor':spark(e.x,e.y,'#ffd24a',10,2,14);ring(e.x,e.y,'#ffd24a',40);break;
      case 'rage':banner('HYDRAZINE RAGE',f.side,'#ff5a1a',true,90);break;
      case 'big':banner('GET BIG!',f.side,'#7fd0ff',true,90);shake=12;break;
      case 'small':banner('BACK TO SIZE',f.side,'#7fd0ff',false,50);break;
      case 'selfburn':spark(f.x,f.y-100*f.c.size,'#ff7a1a',8,2,16);break;
      case 'combo':if(e.n>=3)banner(e.n+' HIT COMBO  '+e.dmg,e.side,'#ffd24a',false,80);break;
      case 'ko':banner('K.O.',-1,'#ff4d4d',true,140);shake=14;SFX.ko();break;
      case 'roundover':if(e.how==='time')banner('TIME',-1,'#ffd24a',true,120);break;
      case 'land':spark(f.x,GROUND-4,'#9fb0bd',e.hard?12:6,2,18);if(e.hard)shake=Math.max(shake,4);break;
      case 'jump':case 'boost':case 'superjump':rmem(f).boostT=e.k==='jump'?0:12;spark(f.x,GROUND-4,'#9fb0bd',4,1.5,12);SFX.jump();break;
      case 'dash':spark(f.x,GROUND-4,'#9fb0bd',6,2,14);break;
      case 'tele':spark(f.x,f.y-60,'#7fd0ff',16,3,16);break;
      case 'clash':spark(e.x,e.y,'#fff',14,3,14);ring(e.x,e.y,'#fff',30);break;
      case 'round':banner('ROUND '+e.n,-1,'#cfd6e0',true,90);SFX.round();break;
      case 'fight':banner('FIGHT!',-1,'#ff5b6b',true,50);break;
      case 'tag':banner('TAG — '+f.c.name,f.side,'#7fd0ff',false,60);SFX.special();break;
      case 'next':banner(f.c.name+' — IN!',-1,f.c.color,true,70);break;
      case 'assist':banner('ASSIST — '+e.name,f.side,f.c.color,false,50);break;
      case 'weak':spark(e.x,e.y,'#ffd24a',10,3,16);ring(e.x,e.y,'#ffd24a',30);if(!rmem(f).wb||frame-rmem(f).wb>40){banner(e.part+'!',e.by.side,'#ffd24a',false,50);rmem(f).wb=frame;}break;
      case 'break':banner('BROUGHT TO A KNEE',-1,'#ffd24a',true,110);shake=16;SFX.ko();spark(f.x,f.y-F.heightOf(f)*0.5,'#ffd24a',30,6,30);break;
      case 'rise':banner('BACK UP',f.side,'#b14bff',false,40);break;
      case 'climb':banner('CLIMB!',f.side,'#7fd0ff',false,60);SFX.special();break;
      case 'shake':banner('SHAKEN OFF',e.by.side,'#b14bff',false,60);shake=8;SFX.throw();break;
      case 'toobig':banner('TOO BIG TO THROW',f.side,'#9fb0bd',false,60);spark(e.x,e.y,'#9fb0bd',8,2,14);break;
      case 'marked':banner('LASED',e.by.side,'#ff3b3b',false,60);break;
      case 'waveburn':banner('WAVE BURN −'+e.n,f.side,'#b14bff',false,60);break;
      // OBLITERATION (52) — our own staging: the window gauge + title card are drawn by drawOblitHUD, the beats here
      case 'oblitopen':SFX.round();break;
      case 'dazed':spark(f.x,f.y-F.heightOf(f)*0.9,'#ffd24a',8,1.5,24);break;
      case 'oblit':for(const b of BAN)if(b.text==='K.O.')b.life=Math.min(b.life,8);flashW=0.5;shake=6;SFX.super();ring(f.x,f.y-F.heightOf(f)*0.5,f.c.color,90);break;
      case 'oblitbeat':{const o=e.on,cx=o.x,cy=o.y-F.heightOf(o)*0.55;spark(cx,cy,f.c.color,14+e.n*6,3+e.n,20);spark(cx,cy,'#fff',6,2,14);ring(cx,cy,f.c.color,40+e.n*14);shake=Math.max(shake,5+e.n*3);SFX.hit(3);rmem(o).flash=0.9;
        if(e.fx==='case')OBR.words.push({w:['CENTAURI','CHARLOTTE','FANFARE'][e.n-1],x:cx,y:cy-80-e.n*26,t:0});break;}
      case 'obliterated':{const by=e.by,cx=f.x,cy=f.y-F.heightOf(f)*0.5;flashW=1;shake=24;SFX.ko();noise(0.9,0.4,300);tone(70,25,1.1,'sawtooth',0.12);
        spark(cx,cy,by.c.color,60,8,44);spark(cx,cy,'#ffffff',30,6,30);spark(cx,cy,'#ffd24a',24,5,36);ring(cx,cy,'#fff',160);ring(cx,cy,by.c.color,240);
        OBR.hit=frame;OBR.name=e.name;OBR.say=e.say;OBR.col=by.c.color;OBR.who=by.c.name;break;}
      case 'oblitmiss':banner('OUT OF RANGE — '+e.need+' NEEDED',f.side,'#9fb0bd',false,90);SFX.block();break;
    }}}
function tickFX(){for(const p of FX){p.life--;if(p.ring){p.r+=(p.max-p.r)*0.3;continue;}p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.vx*=0.96;}
  for(let i=FX.length-1;i>=0;i--)if(FX[i].life<=0)FX.splice(i,1);for(const b of BAN)b.life--;for(let i=BAN.length-1;i>=0;i--)if(BAN[i].life<=0)BAN.splice(i,1);
  if(shake>0)shake*=0.82;if(shake<0.3)shake=0;if(flashW>0)flashW-=0.06;}
function drawFX(){X.save();X.globalCompositeOperation='lighter';
  // PERF 1117 (HIGH TABLE docs/PERF-3D-RULES.md 2): draw at most the 90 newest sparks/rings (they all still spawn + age)
  for(let i=Math.max(0,FX.length-90);i<FX.length;i++){const p=FX[i];const a=clamp(p.life/p.max,0,1);if(p.ring){X.strokeStyle=p.col;X.globalAlpha=a;X.lineWidth=3;X.beginPath();X.arc(p.x,p.y,p.r,0,7);X.stroke();continue;}
    X.globalAlpha=a;X.fillStyle=p.col;X.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);}
  X.restore();}

/* ============================ STAGE ============================ */
/* ---- THE CAMERA (1117, render-only): zooms to frame both full bodies; a giant pulls it out, two exos pull it in.
   docs/LORE-FIGHTER-1117.md §1d. ?cam=0 = the old fixed 1:1 view. ---- */
const CAM={z:1,x0:0,y0:0,on:QS.get('cam')!=='0'&&!CLASSIC,snap:true};const CAM0={z:1,x0:0,y0:0};
function camTarget(E){if(!CAM.on||!E)return CAM0;let L=1e9,R=-1e9,T=1e9;
  for(const f of E.f){const k=f.bigT>0?2:1,hw=f.c.hurt[0]*k,h=F.heightOf(f);L=Math.min(L,f.x-hw-60);R=Math.max(R,f.x+hw+60);T=Math.min(T,f.y-h-46);}
  const B=GROUND+34,spanX=Math.max(R-L,330),spanY=B-T;let z=clamp(Math.min(W/spanX,(H-66)/spanY),0.92,1.9);
  if(E.freeze>0)z*=1.06;const vw=W/z;let x0=(L+R)/2-vw/2;x0=vw>=W?(W-vw)/2:clamp(x0,0,W-vw);return {z,x0,y0:B-H/z};}
function camStep(E){const t=camTarget(E);if(CAM.snap){Object.assign(CAM,t);CAM.snap=false;return;}const e=0.085;CAM.z+=(t.z-CAM.z)*e;CAM.x0+=(t.x0-CAM.x0)*e;CAM.y0+=(t.y0-CAM.y0)*e;
  const vw=W/CAM.z;CAM.x0=vw>=W?(W-vw)/2:clamp(CAM.x0,0,W-vw);CAM.y0=Math.min(CAM.y0,GROUND+34-H/CAM.z);}
function camApply(c,pf){const z=1+(c.z-1)*pf,x0=c.x0*pf,y0=c.y0*pf;X.scale(z,z);X.translate(-x0,-y0);}
function drawStage(t,E,cam){const S=STAGE_INFO[t]||STAGE_INFO.pod19;cam=cam||CAM0;
  const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,S.sky[0]);g.addColorStop(1,S.sky[1]);X.fillStyle=g;X.fillRect(0,0,W,H);
  let any=false;
  for(const [L,pf] of [['far',0.35],['mid',0.65],['near',1]]){const im=plate(t,L);if(im._ok){any=true;X.save();camApply(cam,pf);X.imageSmoothingEnabled=true;X.drawImage(im,-48,0,1056,540);X.restore();}}
  X.save();camApply(cam,1);
  if(!any){X.fillStyle='#0b0e16';X.fillRect(-200,GROUND,W+400,H);X.strokeStyle=S.acc;X.globalAlpha=0.4;X.beginPath();X.moveTo(-200,GROUND);X.lineTo(W+200,GROUND);X.stroke();X.globalAlpha=1;}
  // fog of the theater (render-only)
  const fg=X.createLinearGradient(0,GROUND-140,0,GROUND+80);fg.addColorStop(0,'rgba(5,7,13,0)');fg.addColorStop(1,'rgba(5,7,13,.45)');X.fillStyle=fg;X.fillRect(-300,GROUND-140,W+600,400);

const ML_CAP=404,ML_Y=92;
/*@ml-pager*/
function mlPages(rows,cap){const pages=[];let pg=[],h=0,last='';
  const brk=()=>{if(pg.length)pages.push(pg);pg=[];h=0;};
  for(const r of rows){const rh=r.group==='OBLITERATION'?84:r.note||r.alt?40:26,hdr=r.group!==last||!pg.length;
    if(h+(hdr?24:0)+rh>cap)brk();
    if(r.group!==last||!pg.length){pg.push({hdr:r.group,cont:r.group===last,h:24});h+=24;last=r.group;}
    pg.push({row:r,h:rh});h+=rh;}
  brk();return pages;}

/* ============================ OBLITERATION (52, render-only) ============================
   Our own staging: the loser stands dazed with a RANGE gauge on screen (the needed band lit, a marker for the spacing,
   the window draining); on a hit the stage drops to black, the finisher plays its beats (per-suit fx below, drawn from
   the sim's fixed sequence clock E.oblit.st), the loser comes apart on its destroyed_* drawings, and the title card
   reads OBLITERATION + the finisher's name + the winner's line. New oblit_0..6 drawings are used when the atlas has
   them (FRAMES-52); until then the winner plays its spec_0..6 set under a gold flash. */
function drawOblitWorld(E){const O=E.oblit;if(!O)return;const w=E.f[O.side],o=E.f[1-O.side];
  const oh=F.heightOf(o),cx=o.x,cy=o.y-oh*0.55,wx=w.x+w.face*w.c.hurt[0]*0.6,wy=w.y-F.heightOf(w)*0.6,col=w.c.color,st=O.st,t=frame;
  const beam=(x0,y0,x1,y1,c,wd,a)=>{X.globalAlpha=a;X.strokeStyle=c;X.lineWidth=wd;X.beginPath();X.moveTo(x0,y0);X.lineTo(x1,y1);X.stroke();};
  X.save();X.globalCompositeOperation='lighter';
  if(o.state==='dazed'){for(let i=0;i<5;i++){const a=t*0.08+i*1.2566;X.fillStyle=i%2?'#ffd24a':'#fff';X.globalAlpha=0.8;X.beginPath();X.arc(o.x+Math.cos(a)*o.c.hurt[0]*0.7,o.y-oh-12+Math.sin(a)*8,3.5,0,7);X.fill();}}
  if(O.ph==='seq'&&st<F.OB_HIT){const k=Math.min(1,st/F.OB_HIT);
    X.globalAlpha=0.5+0.3*Math.sin(t*0.4);X.strokeStyle=col;X.lineWidth=2;X.beginPath();X.arc(w.x,w.y-F.heightOf(w)*0.5,F.heightOf(w)*(0.55+0.1*Math.sin(t*0.3)),0,7);X.stroke();
    switch(O.fx){
      case 'drill':for(let i=0;i<10;i++){const a=t*0.5+i*0.63,rr=10+i*4;X.globalAlpha=0.7;X.fillStyle=i%2?col:'#fff';X.beginPath();X.arc(cx-o.face*o.c.hurt[0]*0.4+Math.cos(a)*rr*0.4,cy+Math.sin(a)*rr,3,0,7);X.fill();}
        if(st>54)beam(cx-o.face*o.c.hurt[0],cy,cx+o.face*o.c.hurt[0]*1.4,cy,'#fff',4,0.8);break;
      case 'fire':for(let i=0;i<18;i++){const ph=(t*0.07+i*0.37)%1;X.globalAlpha=Math.min(1,(1-ph)*0.55*k*1.6);X.fillStyle=i%3?'#ff7a1a':'#ffd24a';X.beginPath();X.arc(cx+Math.sin(i*2.1+t*0.1)*o.c.hurt[0]*1.1,o.y-ph*oh*1.3,10+ph*26,0,7);X.fill();}
        if(st>54){X.globalAlpha=0.7;X.strokeStyle='#cfe6ff';X.lineWidth=3;X.beginPath();X.ellipse(cx,o.y,o.c.hurt[0]*2.2,oh*1.2*Math.min(1,(st-54)/24),0,Math.PI,0);X.stroke();}break;   // the emergency Atmodome closes
      case 'vortex':for(let i=0;i<6;i++){const a=t*0.12+i*1.047,rx=o.c.hurt[0]*1.6,ry=oh*0.5,px=cx+Math.cos(a)*rx,py=cy+Math.sin(a)*ry*0.6;
          X.globalAlpha=0.8;X.fillStyle='#7fd0ff';X.beginPath();X.arc(px,py,7,0,7);X.fill();if(i<2)beam(wx,wy,px,py,col,2,0.5);}
        X.globalAlpha=0.35;X.strokeStyle='#3affe0';X.lineWidth=3;for(let j=0;j<3;j++){X.beginPath();X.ellipse(cx,cy,o.c.hurt[0]*(1.2+j*0.4),oh*0.15+j*10,0,0,7);X.stroke();}break;
      case 'lift':if(st>=24)for(let i=0;i<6;i++){X.globalAlpha=0.6;X.fillStyle=i%2?'#ffd24a':'#ff7a1a';X.beginPath();X.arc(w.x+(i-2.5)*8,w.y+18+((t*7+i*5)%14),6,0,7);X.fill();}break;
      case 'toxin':X.globalAlpha=0.6;X.strokeStyle='#caa01a';X.lineWidth=6;X.beginPath();for(let j=0;j<=16;j++){const xx=wx+(cx-wx)*j/16,yy=wy+(cy-wy)*j/16+Math.sin(t*0.4+j)*5;j?X.lineTo(xx,yy):X.moveTo(xx,yy);}X.stroke();
        for(let i=0;i<10;i++){const a=i*0.9+t*0.03;X.globalAlpha=Math.min(0.5,0.44*k);X.fillStyle='#9bff5b';X.beginPath();X.arc(cx+Math.sin(a)*o.c.hurt[0],cy+Math.cos(a*1.3)*oh*0.4,18+12*k,0,7);X.fill();}break;
      case 'cloak':for(let i=0;i<6;i++){const at=30+i*11;if(st<at||st>at+10)continue;const a=i*1.05+0.4,L=oh*0.7;beam(cx-Math.cos(a)*L,cy-Math.sin(a)*L,cx+Math.cos(a)*L,cy+Math.sin(a)*L,i%2?'#7fd0ff':'#fff',5,1-(st-at)/10);}break;   // six prong slashes, six angles
      case 'water':{const lv=Math.min(1,st/40),g=X.createLinearGradient(0,GROUND-60*lv,0,GROUND);g.addColorStop(0,'rgba(46,155,216,0)');g.addColorStop(1,'rgba(46,155,216,.6)');X.globalAlpha=1;X.fillStyle=g;X.fillRect(-200,GROUND-60*lv,W+400,60*lv);
        for(let j=0;j<12;j++){X.globalAlpha=0.3;X.fillStyle='#7fd0ff';X.beginPath();X.ellipse(cx+Math.sin(t*0.3+j)*o.c.hurt[0]*0.6,o.y-j*oh/10,o.c.hurt[0]*(1.2-j*0.05),8,0,0,7);X.fill();}break;}
      case 'blades':for(let i=0;i<3;i++){const at=30+i*24;if(st<at||st>at+16)continue;const L=oh*0.35,a=(st-at)/16;beam(cx-L,cy-L,cx+L,cy+L,'#fff',4,1-a);beam(cx+L,cy-L,cx-L,cy+L,col,4,1-a);}break;
      case 'case':{const p=Math.min(1,st/44),bx=w.x+(o.x-w.x)*p;X.globalAlpha=1;X.globalCompositeOperation='source-over';X.fillStyle='#2a2f3a';X.fillRect(bx-14,GROUND-14,28,14);X.fillStyle=(t>>3)%2?'#9fe8ff':'#ff3b3b';X.fillRect(bx-3,GROUND-12,6,3);X.globalCompositeOperation='lighter';break;}
      case 'silk':for(let i=0;i<8;i++){const ex=i<4?F.XMIN:F.XMAX,ey=GROUND-40-i%4*70,q=Math.min(1,st/24);beam(cx,cy,cx+(ex-cx)*q,cy+(ey-cy)*q,'#e8f4ff',1.5,0.6);}
        for(let j=0;j<Math.min(14,(st-24)/4);j++){X.globalAlpha=0.7;X.strokeStyle='#fff';X.lineWidth=2;X.beginPath();X.ellipse(cx,o.y-oh*(0.1+j*0.065),o.c.hurt[0]*1.05,6,0.15*(j%2?1:-1),0,7);X.stroke();}break;
      case 'tide':{const up=st<70?Math.min(1,st/50):Math.max(0,1-(st-70)/26),hh=(oh+160)*up,xb=cx-o.face*o.c.hurt[0]*1.4;X.globalAlpha=0.75;X.fillStyle='#0e6a74';X.beginPath();X.moveTo(xb-90,GROUND);
        for(let j=0;j<=12;j++)X.lineTo(xb-90+j*15,GROUND-hh+Math.sin(t*0.3+j)*8+(st>=70?j*6:0));X.lineTo(xb+90,GROUND);X.fill();break;}
      case 'hammer':{const b=[30,54,78].find(b=>st>=b&&st<b+10);if(b!=null){const r=(st-b)*16;X.globalAlpha=0.7;X.strokeStyle='#e0a92e';X.lineWidth=3;X.beginPath();X.ellipse(cx,GROUND,r,r*0.2,0,0,7);X.stroke();}break;}
      case 'orb':{const ox=w.x+w.face*w.c.hurt[0]*0.45,oy=w.y-F.heightOf(w)*0.71,gg=X.createRadialGradient(ox,oy,2,ox,oy,50);gg.addColorStop(0,'rgba(240,200,255,.95)');gg.addColorStop(1,'rgba(177,75,255,0)');X.globalAlpha=0.8;X.fillStyle=gg;X.beginPath();X.arc(ox,oy,50,0,7);X.fill();
        if(st>=60){beam(ox,oy,cx,cy,'#d68bff',26,0.55+0.2*Math.sin(t*0.9));beam(ox,oy,cx,cy,'#fff',7,0.9);}break;}
    }}
  if(o.state==='obliterated'&&(frame&3)===0)spark(cx+(Math.random()-0.5)*o.c.hurt[0]*2,GROUND-10,'#5a6070',2,1.2,40);   // smoke over the wreck
  X.globalCompositeOperation='source-over';
  for(const q of OBR.words){q.t++;X.globalAlpha=Math.max(0,1-q.t/90);txt(q.w,q.x,q.y-q.t*0.3,'#9fe8ff',16,true,'center');}
  X.restore();}
function drawOblitHUD(E){const O=E.oblit;if(!O)return;const w=E.f[O.side],o=E.f[1-O.side],ob=w.c.oblit;
  if(O.ph==='window'){const a=0.75+0.25*Math.sin(frame*0.25);
    X.fillStyle='rgba(5,7,13,.78)';X.fillRect(W/2-250,H-128,500,98);X.strokeStyle='#ff5a1a';X.globalAlpha=a;X.strokeRect(W/2-249.5,H-127.5,499,97);X.globalAlpha=1;
    txt('OBLITERATION',W/2,H-104,'#ff5a1a',22,true,'center');
    txt(fit_(w.c.name+' · '+ob.name+'  '+F.MOTION_TXT[ob.motion]+' + '+ob.btn,15,480,true),W/2,H-84,'#ffd24a',15,true,'center');
    // the RANGE gauge: gap -40..440 sim px across 440 screen px; the needed band lit, a marker for the spacing now
    const gx=W/2-220,gw=440,gy=H-72,toX=g=>gx+clamp((g+40)/480,0,1)*gw;

    txt(ob.name,W/2,H/2-28,OBR.col||w.c.color,26,true,'center');if(k>30)txt('"'+ob.say+'"',W/2,H/2,'#cfd6e0',15,true,'center');X.globalAlpha=1;}}

/* ============================ FIGHT FRAME ============================ */
let slow=0;
function fightTick(){
  const E=M.E;
  const O=E.oblit;      // KO slow-motion (render pacing only; the sim steps the same): the KO, or the first beat of an Obliteration window's fall
  if((M.phase==='ko'&&M.pt<45&&!O)||(M.phase==='oblit'&&O&&O.ph==='window'&&O.fall<14&&E.f[1-O.side].state==='ko')){if(++slow%3)return;}
  const solo=!cfg.two;
  const ins=[0,1].map(s=>{
    if(cfg.cpu[s])return QA.idleCpu?{}:F.cpu(E,s,cfg.lvl[s]);
    if(cfg.mode==='training'&&s===1)return F.dummy(E,1,TR.dummy);
    return unlatch(s,sideInput(s,solo&&s===0));});
  if(cfg.mode==='training')logInput(E,ins[0]);
  M.step(ins[0],ins[1]);onEvents(M.events);
  if(M.over){endT++;if(endT>70)onMatchOver();}
  if(DEMO&&++demoT>50*60)toTitle();}
function drawFight(){const E=M.E;
  camStep(E);
  X.save();if(shake>0)X.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawStage(cfg.stage,E,CAM);
  if(E.freeze>0){X.fillStyle='rgba(0,0,0,'+(0.5*Math.min(1,E.freeze/10))+')';X.fillRect(0,0,W,H);}
  const ob=E.oblit;if(ob&&(ob.ph==='seq'||ob.result==='obliterated')){X.fillStyle='rgba(0,0,0,'+(ob.ph==='seq'?Math.min(0.62,ob.st/30):0.5)+')';X.fillRect(0,0,W,H);}
  X.save();camApply(CAM,1);
  drawZones(E);
  // the giant draws first (it's the backdrop of the duel); then whoever isn't attacking; a climber rides on top
  const order=E.f.slice().sort((a,b)=>(a.mountT>0?2:0)-(b.mountT>0?2:0)+(F.isGiant(b)?1:0)-(F.isGiant(a)?1:0)+((a.move?1:0)-(b.move?1:0))*0.5);for(const f of order)drawSuit(f,E);
  if(E.assists)for(const a of E.assists)drawSuit(a,E);
  drawProjs(E);drawOblitWorld(E);drawFX();
  if(cfg.mode==='training'&&TR.hit)drawBoxes(E);
  X.restore();
  X.restore();
  if(TOUCH.on&&!cfg.cpu[0])drawTouch();
  if(flashW>0){X.fillStyle='rgba(255,240,200,'+(flashW*0.5)+')';X.fillRect(0,0,W,H);}
  if(E.freeze>0){const f=E.f[E.freezeBy];txt(f.c.super.name,W/2,140,'#ffd24a',40,true,'center');txt(f.c.pilot,W/2,166,'#cfd6e0',14,true,'center');}
  drawHUD(E);if(cfg.mode==='training')drawTraining(E);drawOblitHUD(E);
  if(paused)drawPause();}

/* ============================ LOOP ============================ */
let lastT=0,acc=0;
function loop(now){requestAnimationFrame(loop);
  const dt=Math.min(100,now-(lastT||now));lastT=now;acc+=dt;let steps=0;
  while(acc>=1000/60&&steps<4){acc-=1000/60;steps++;tick();}
  render();}
function tick(){frame++;pollPadMenus();
  if(GS==='boot'){if(++bootT>170){GS='title';if(window.CKBoot)CKBoot.release();}return;}
  if(GS==='title'&&ATTRACT_F>0&&++idleT>ATTRACT_F)startDemo();
  if(GS==='fight'&&!paused)fightTick();
  if(GS==='vs'||GS==='results'||GS==='ending')endT++;
  tickFX();}
function render(){X.imageSmoothingEnabled=true;
  switch(GS){case 'boot':drawBoot();break;case 'title':drawTitle();break;case 'menu':drawMenu();break;case 'select':drawSelect();break;
    case 'vs':drawVS();break;case 'fight':drawFight();break;case 'results':drawResults();break;case 'ending':drawEnding();break;
    case 'movelist':drawMovelist();break;case 'howto':drawHow();break;}}

/* ---- deep links (developer / launcher doors; CK BOOT rule 7) ---- */
(function(){const m=QS.get('mode');if(!m)return;GS='title';if(window.CKBoot)CKBoot.release();
  const p1=F.CHARS[QS.get('p1')]?QS.get('p1'):'sandtrap',p2=F.CHARS[QS.get('p2')]?QS.get('p2'):'holyroller',st=STAGE_INFO[QS.get('stage')]?QS.get('stage'):'pod19';
  if(m==='demo')startDemo();
  else if(m==='training')startFight({mode:'training',p1,p2,stage:st,cpu:[false,false],lvl:[diff,diff]});
  else if(m==='cpu')startFight({mode:'versus',p1,p2,stage:st,cpu:[true,true],lvl:[diff,diff],seed:+(QS.get('seed')||7)});
  else if(m==='versus')startFight({mode:'versus',p1,p2,stage:st,cpu:[false,true],lvl:[diff,diff]});
  else if(m==='arcade'){startArcade(p1);}
  else if(m==='tag'||m==='raid'){const L=k=>(QS.get(k)||'').split(',').filter(x=>F.CHARS[x]);const t1=L('t1').length?L('t1'):['sandtrap','solitaire','foxeylady'].slice(0,+(QS.get('n')||3));
    const t2=m==='raid'?['morningstar']:(L('t2').length?L('t2'):['namor','angie','holyroller'].slice(0,t1.length));const auto=QS.has('auto');
    startFight({mode:m,team1:t1,team2:t2,stage:st,cpu:[auto,true],lvl:[diff,diff],seed:+(QS.get('seed')||7)});}
  else if(m==='movelist'){mlId=p1;GS='movelist';}else if(m==='menu')GS='menu';else if(m==='select'){newSel('versus');}})();
/* ---- PHONE PAD (1117): left thumb = stick (drag), right thumb = L M H S + TAG / ASSIST. Render-only input; ?touch=1 forces it. ---- */
const TOUCH={on:QS.get('touch')==='1'||(('ontouchstart' in window)&&QS.get('touch')!=='0'),o:{},stick:null,btn:{}};
// PAD_LIFT (HUD-1117): the pad sits 48 px up so the bottom row (SP, TAG) clears the SUPER meter band (label top ~H-44); was sitting on P2's meter.
const PAD_LIFT=48,TB=[['L',W-200,H-70-PAD_LIFT,'L'],['M',W-130,H-100-PAD_LIFT,'M'],['H',W-60,H-130-PAD_LIFT,'H'],['S',W-130,H-30-PAD_LIFT,'SP'],['G',W-60,H-60-PAD_LIFT,'TAG'],['A',W-200,H-140-PAD_LIFT,'AST']];
function touchXY(t){const r=C.getBoundingClientRect();return [(t.clientX-r.left)*W/r.width,(t.clientY-r.top)*H/r.height];}
function touchRead(e){if(GS!=='fight')return;e.preventDefault();TOUCH.o={};let st=null;
  for(const t of e.touches){const [x,y]=touchXY(t);if(x<W*0.45){if(!TOUCH.stick)TOUCH.stick=[x,y];st=[x,y];const dx=x-TOUCH.stick[0],dy=y-TOUCH.stick[1];
      if(dx<-18)TOUCH.o.l=true;if(dx>18)TOUCH.o.r=true;if(dy<-22)TOUCH.o.u=true;if(dy>22)TOUCH.o.d=true;}
    else for(const b of TB)if(Math.hypot(x-b[1],y-b[2])<32)TOUCH.o[b[0]]=true;}
  if(!st)TOUCH.stick=null;TOUCH.cur=st;}
if(TOUCH.on){for(const ev of ['touchstart','touchmove','touchend','touchcancel'])C.addEventListener(ev,touchRead,{passive:false});}
// 52: on a phone, tap the round timer to pause; tap a pause item to pick it; in the move list tap ◀ ▶ (left panel), the
// top / bottom of the list for ▲ ▼, and BACK (top right)
C.addEventListener('touchstart',e=>{if(!TOUCH.on||!e.changedTouches.length)return;const [x,y]=touchXY(e.changedTouches[0]);
  if(GS==='fight'&&!paused&&Math.abs(x-W/2)<44&&y<60){e.preventDefault();menuKey('Escape');return;}
  if(GS==='fight'&&paused){const it=pauseItems(),i=Math.round((y-(H/2-96))/32);e.preventDefault();if(i>=0&&i<it.length&&Math.abs(x-W/2)<220){pauseI=i;menuKey('Enter');}return;}
  if(GS==='movelist'){e.preventDefault();if(x>W-100&&y<64)menuKey('Escape');else if(x<262&&y<120)menuKey(x<131?'ArrowLeft':'ArrowRight');else if(x>=262)menuKey(y<H/2?'ArrowUp':'ArrowDown');}},{passive:false});
function drawTouch(){X.save();X.globalAlpha=0.35;for(const b of TB){X.fillStyle=TOUCH.o[b[0]]?'#ffd24a':'#1a2030';X.beginPath();X.arc(b[1],b[2],28,0,7);X.fill();X.strokeStyle='#cfd6e0';X.stroke();X.globalAlpha=0.8;txt(b[3],b[1],b[2]+4,'#fff',11,true,'center');X.globalAlpha=0.35;}
  if(TOUCH.stick){X.strokeStyle='#cfd6e0';X.beginPath();X.arc(TOUCH.stick[0],TOUCH.stick[1],46,0,7);X.stroke();if(TOUCH.cur){X.fillStyle='#cfd6e0';X.beginPath();X.arc(TOUCH.cur[0],TOUCH.cur[1],18,0,7);X.fill();}}
  X.restore();}
const QA={idleCpu:false};   // headless QA only (tools/_qa): park the CPU so scripted keys land
window.__faf={get GS(){return GS;},get M(){return M;},F,startFight,keys,QA};
requestAnimationFrame(loop);
</script>
