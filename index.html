<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FOG AND FIRE: THE LUNAR PACT</title>
<!-- ============================================================
     FOG AND FIRE: THE LUNAR PACT — a Castle Killscreen MECH FIGHTING GAME.
     Anders & Partners LLC · Joseph Coleman, First Partner. Tight canon to the FOG AND FIRE screenplays.
     North star: Gundam Wing; play model: Gundam Battle Assault / Street Fighter — 1v1 duels on a 2D plane,
     best of 3, chains, target combos, launchers, motion specials, one super per suit.
     The sim is lib/fight.js (deterministic, 60 Hz, seeded). The suits are 3D Blender builds (3D PIPELINE/
     games/fog-and-fire) drawn RENDER-ONLY from their atlases; nothing the renderer does touches the fight.
     The old squad wave game lives on as the bonus mode: waves.html.
     ============================================================ -->
<meta name="author" content="Joseph Coleman, First Partner — Anders & Partners LLC">
<meta name="theme-color" content="#05070d">
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Courier New",ui-monospace,monospace;color:#cfd6e0;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{background:#05070d;box-shadow:0 0 0 2px #1a1f2b,0 0 60px rgba(0,0,0,.8);max-width:100vw;max-height:100vh;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<script src="lib/ckboot.js?v=1"></script>
<script src="lib/ghost.js?v=1"></script>
<script src="lib/fight.js?v=1"></script>
<script src="lib/fafatlas.js?v=1"></script>
<script>
'use strict';
/* ============================ CORE ============================ */
const C=document.getElementById('c'),X=C.getContext('2d');
const W=960,H=540,F=FAFFight,GROUND=F.GROUND;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);C.style.width=((W*s)|0)+'px';C.style.height=((H*s)|0)+'px';}
addEventListener('resize',fit);fit();
const QS=new URLSearchParams(location.search||'');
const FONT=(px,b)=>(b?'bold ':'')+px+'px "Courier New",monospace';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let frame=0;

/* ============================ ASSETS (render-only) ============================ */
// The Pages bundle carries WebP copies in 3d/ (cut by the 3D pipeline); the master reads the pipeline's PNGs directly.
const BASES=/FOG(%20| )AND(%20| )FIRE\//.test(decodeURI(location.pathname)+location.pathname)?[['../3D%20PIPELINE/games/fog-and-fire/renders/','png'],['3d/renders/','webp']]:[['3d/renders/','webp'],['../3D%20PIPELINE/games/fog-and-fire/renders/','png']];
const IMGS={};
function img(rel){let im=IMGS[rel];if(im)return im;im=IMGS[rel]=new Image();im._ok=false;let i=0;
  const next=()=>{if(i>=BASES.length){im._bad=true;return;}const b=BASES[i++];im.src=b[0]+rel+'.'+b[1];};
  im.onload=()=>{im._ok=true;};im.onerror=next;next();return im;}
const sheet=(sid,pass)=>img('atlas/'+sid+'_'+pass+'_1x');
for(const sid in FAF_ATLAS){sheet(sid,'color');sheet(sid,'glow');}
const STAGE_INFO={
  pod19:{name:'POD 19',sub:'over the pod · Phaser on the deck',sky:['#1a0e1e','#3a1430'],acc:'#ff5bc8'},
  newqom:{name:'NEW QOM',sub:'the Imamate’s holy city under the dome',sky:['#0a1428','#16305a'],acc:'#7fd0ff'},
  underhive:{name:'MARS UNDERHIVE',sub:'blue-collar depths',sky:['#0a0610','#1a0a1c'],acc:'#ff5bc8'},
  crawler:{name:'THE LUNAR CRAWLER',sub:'the squad’s mobile fortress',sky:['#05070d','#141a2a'],acc:'#9fb0bd'},
  ishtar:{name:'ISHTAR · VENUS',sub:'sulfur fog · the rebuild',sky:['#3a2e08','#6a5410'],acc:'#ffd24a'}};
const plate=(t,L)=>img('env_bk/'+t+'/1x/'+L);
for(const t in STAGE_INFO)for(const L of ['far','mid','near'])plate(t,L);

// suit -> atlas + render tint. The Great Ones ride a squad model in their own colours until they get Blender builds.
const LOOK={sandtrap:{sid:'sandtrap_bk'},backdraft:{sid:'backdraft_bk'},holyroller:{sid:'holyroller_bk'},foxeylady:{sid:'foxeylady_bk'},
  poison:{sid:'poison_bk'},solitaire:{sid:'solitaire_bk'},namor:{sid:'namor_bk'},angie:{sid:'angie_bk'},morningstar:{sid:'morningstar'},
  deadletter:{sid:'solitaire_bk',tint:{col:'#5fd8ff',a:0.55,lift:0.18}},widow:{sid:'angie_bk',tint:{col:'#d8f0c0',a:0.8,lift:0.12}},
  undertow:{sid:'namor_bk',tint:{col:'#14c4b0',a:0.75}},anvil:{sid:'foxeylady_bk',tint:{col:'#c08a22',a:0.75}}};
const tmp=document.createElement('canvas'),tg=tmp.getContext('2d');
function sk(id){const L=LOOK[id]||LOOK.sandtrap,A=FAF_ATLAS[L.sid],c=F.CHARS[id];return A&&c?c.hurt[1]*1.12/A.vh:1;}
function drawCell(id,name,x,y,face,k,o){
  o=o||{};const L=LOOK[id]||LOOK.sandtrap,sid=L.sid,A=FAF_ATLAS[sid];if(!A)return false;k*=sk(id);
  const fr=A.frames[name]||A.frames[name.replace(/_d[12]_/,'_')]||A.frames[name.replace(/_\d+$/,'_0')]||A.frames.idle_0;
  const im=sheet(sid,'color');if(!im._ok)return false;
  const cw=A.cell[0],ch=A.cell[1],ax=A.anchor[0],ay=A.anchor[1],sx=fr[0]*cw,sy=fr[1]*ch;
  X.save();X.translate(x,y);X.scale(face,1);if(o.rot)X.rotate(o.rot);X.scale(k,k*(o.sy||1));if(o.alpha!=null)X.globalAlpha=o.alpha;
  X.imageSmoothingEnabled=true;
  const tint=L.tint,flash=o.flash||0;
  if(tint||flash){tmp.width=cw;tmp.height=ch;tg.drawImage(im,sx,sy,cw,ch,0,0,cw,ch);
    if(tint){tg.globalCompositeOperation='color';tg.globalAlpha=tint.a;tg.fillStyle=tint.col;tg.fillRect(0,0,cw,ch);
      if(tint.lift){tg.globalCompositeOperation='lighter';tg.globalAlpha=tint.lift;tg.fillRect(0,0,cw,ch);}}
    if(flash){tg.globalCompositeOperation='lighter';tg.globalAlpha=flash;tg.fillStyle=o.flashCol||'#fff';tg.fillRect(0,0,cw,ch);}
    tg.globalAlpha=1;tg.globalCompositeOperation='destination-in';tg.drawImage(im,sx,sy,cw,ch,0,0,cw,ch);tg.globalCompositeOperation='source-over';
    X.drawImage(tmp,-ax,-ay);}
  else X.drawImage(im,sx,sy,cw,ch,-ax,-ay,cw,ch);
  const g=sheet(sid,'glow');if(g._ok&&o.glow!==false){X.globalCompositeOperation='lighter';X.globalAlpha=(o.alpha!=null?o.alpha:1)*0.85;X.drawImage(g,sx,sy,cw,ch,-ax,-ay,cw,ch);}
  X.restore();return true;}

/* ============================ AUDIO (tiny synth; CK BOOT: the first press on a blocked page only wakes it) ============================ */
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}return AC;}
if(window.CKBoot)CKBoot.onUnlock(()=>{const a=ac();if(a&&a.resume)a.resume();});
let MUTE=QS.has('mute');
function tone(f0,f1,dur,type,vol,delay){const a=ac();if(!a||a.state!=='running'||MUTE)return;const t=a.currentTime+(delay||0);
  const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol||0.08,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.02);}
function noise(dur,vol,lp){const a=ac();if(!a||a.state!=='running'||MUTE)return;const n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=lp||1800;
  const g=a.createGain();g.gain.value=vol||0.2;s.connect(f);f.connect(g);g.connect(a.destination);s.start();}
const SFX={hit:l=>{noise(0.08+l*0.03,0.18+l*0.06,600+l*500);tone(180-l*25,50,0.12,'sine',0.12);},block:()=>{tone(1400,900,0.05,'square',0.04);noise(0.04,0.08,4000);},
  special:()=>tone(300,900,0.18,'sawtooth',0.05),super:()=>{tone(120,1200,0.5,'sawtooth',0.07);tone(240,2400,0.5,'square',0.03,0.05);},
  ko:()=>{noise(0.6,0.35,500);tone(90,30,0.7,'sine',0.2);},ui:()=>tone(660,880,0.05,'square',0.04),ok:()=>{tone(520,1040,0.08,'square',0.05);},
  throw:()=>{noise(0.15,0.3,400);tone(120,40,0.2,'sine',0.15);},jump:()=>tone(200,320,0.06,'triangle',0.03),parry:()=>{tone(1800,2400,0.12,'square',0.05);tone(900,1200,0.12,'square',0.04,0.04);},
  round:()=>{tone(440,440,0.12,'square',0.05);tone(660,660,0.18,'square',0.05,0.14);}};

/* ============================ INPUT ============================ */
const keys={};let anyPress=false;
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab','Backspace'].includes(e.code))e.preventDefault();
  if(window.CKBoot&&CKBoot.held())return;keys[e.code]=true;if(!e.repeat){anyPress=true;menuKey(e.code);}});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
// P1 = WASD + J K L (light medium heavy) + I (special) · U = throw (L+M) · O = super (S+H)
// P2 = ARROWS + Numpad 1 2 3 + Numpad 0 (alt , . / and ') · Numpad 4 throw · Numpad 6 super
// SOLO (P2 is the CPU): P1 may also use ARROWS + Z X C (L M H) + V (special) · B throw · N super
const KB=[{l:['KeyA'],r:['KeyD'],u:['KeyW'],d:['KeyS'],L:['KeyJ'],M:['KeyK'],H:['KeyL'],S:['KeyI'],T:['KeyU'],SU:['KeyO']},
  {l:['ArrowLeft'],r:['ArrowRight'],u:['ArrowUp'],d:['ArrowDown'],L:['Numpad1','Comma'],M:['Numpad2','Period'],H:['Numpad3','Slash'],S:['Numpad0','Quote'],T:['Numpad4'],SU:['Numpad6']}];
const SOLO={l:['ArrowLeft'],r:['ArrowRight'],u:['ArrowUp'],d:['ArrowDown'],L:['KeyZ'],M:['KeyX'],H:['KeyC'],S:['KeyV'],T:['KeyB'],SU:['KeyN']};
function readMap(m,o){for(const k in m)if(m[k].some(c=>keys[c]))o[k]=true;return o;}
const PADS=[{},{}];
function padRead(i){let gp=null;try{const ps=navigator.getGamepads?navigator.getGamepads():[];let n=0;for(const p of ps){if(p){if(n===i){gp=p;break;}n++;}}}catch(e){}
  const o={};if(!gp)return o;const G=Ghost.read(gp),b=k=>Ghost.btn(gp,k);
  if(G.ax<-0.5)o.l=true;if(G.ax>0.5)o.r=true;if(G.ay<-0.5)o.u=true;if(G.ay>0.5)o.d=true;
  if(b(2))o.L=true;if(b(3))o.M=true;if(b(1)||b(5))o.H=true;if(b(0))o.S=true;if(b(4))o.T=true;if(b(6)||b(7))o.SU=true;if(b(9))o.START=true;o.present=true;return o;}
function sideInput(s,solo){const o={};readMap(KB[s],o);if(solo&&s===0)readMap(SOLO,o);const p=padRead(s);for(const k in p)if(p[k])o[k]=true;
  if(o.T){o.L=true;o.M=true;}if(o.SU){o.S=true;o.H=true;}return o;}
// pads drive the menus too (edge-triggered into menuKey)
const padPrev=[{},{}];
function pollPadMenus(){for(let i=0;i<2;i++){const p=padRead(i);if(!p.present)continue;const pr=padPrev[i];
  const fire=(name,code,now)=>{if(now&&!pr[name]){if(!(window.CKBoot&&CKBoot.held())){anyPress=true;menuKey(code,i);}}pr[name]=now;};
  if(GS!=='fight'||paused){fire('l',i?'ArrowLeft':'KeyA',p.l);fire('r',i?'ArrowRight':'KeyD',p.r);fire('u',i?'ArrowUp':'KeyW',p.u);fire('d',i?'ArrowDown':'KeyS',p.d);
    fire('S',i?'Numpad1':'KeyJ',p.S);fire('H',i?'Escape':'Escape',p.H);}
  fire('START','Escape',p.START&&GS==='fight');fire('STARTm','Enter',p.START&&GS!=='fight');}}

/* ============================ PERSISTENCE (unlocks only) ============================ */
let SAVE=(()=>{try{return JSON.parse(localStorage.getItem('faf_duel'))||{};}catch(e){return {};}})();
function save(){try{localStorage.setItem('faf_duel',JSON.stringify(SAVE));}catch(e){}}
if(QS.has('unlock'))SAVE.clear=1;
const locked=id=>!!F.CHARS[id].lock&&!SAVE.clear;

/* ============================ STATE ============================ */
let GS=QS.has('noboot')?'title':'boot',bootT=0,idleT=0,endT=0,paused=false,pauseI=0,pauseSub='';
const ATTRACT_F=(QS.has('attract')&&QS.get('attract')!==''?+QS.get('attract'):25)*60; // ?attract=0 turns the title demo off
const DIFFS=['EASY','NORMAL','HARD','HARDEST'];let diff=+(QS.get('cpu')||1);
const MENU=['ARCADE','VERSUS CPU','VERSUS 2P','TRAINING','MOVE LIST','SQUAD WAVES (BONUS)','HOW TO PLAY'];let menuI=0;
let mode='versus',sel=null,stageSel=0,M=null,cfg=null,ARC=null,DEMO=false,demoT=0,resultI=0;
let mlId='sandtrap',mlScroll=0,howFrom='menu',mlFrom='menu';
const TR={hit:QS.has('hitbox'),dummy:'stand',inf:true,fd:true,hist:[],lastIn:'',last:null};
const DUMMIES=['stand','crouch','jump','block','cpu'];
if(window.CKBoot&&GS==='boot')CKBoot.hold(Infinity);

/* ============================ FLOW ============================ */
function toTitle(){GS='title';idleT=0;DEMO=false;paused=false;}
function startDemo(){const pool=F.ROSTER.slice(0,8),r=Math.random;const a=pool[(r()*8)|0];let b=pool[(r()*8)|0];if(b===a)b=pool[(pool.indexOf(a)+3)%8];
  DEMO=true;demoT=0;startFight({mode:'demo',p1:a,p2:b,stage:F.STAGES[(r()*5)|0],cpu:[true,true],lvl:[2,2],seed:(r()*1e6)|0});}
function startFight(c){cfg=c;M=F.match({p1:c.p1,p2:c.p2,seed:c.seed||((Math.random()*1e9)|0),training:c.mode==='training',infMeter:c.mode==='training'&&TR.inf});
  GS='fight';paused=false;endT=0;FX.length=0;BAN.length=0;shake=0;R0.clear&&R0.clear();RM.length=0;TR.hist.length=0;TR.last=null;
  if(c.mode==='training')resetTraining();}
function resetTraining(){const E=M.E;E.f[0].x=W/2-120;E.f[1].x=W/2+120;for(const f of E.f){f.y=GROUND;f.vx=f.vy=0;f.hp=f.maxhp;f.move=null;f.mkey='';f.state='stand';f.hitstun=f.blockstun=f.kd=0;f.airHit=false;f.juggle=0;f.juggleFull=false;f.bigT=0;}E.projs.length=0;E.zones.length=0;E.f[0].face=1;E.f[1].face=-1;}
function newSel(m){mode=m;sel={step:0,cur:[0,1],pick:[null,null],ready:[false,false],stage:-1,who:0};
  if(m==='versus2p')sel.cur=[0,1];GS='select';}
function beginFromSelect(){const st=sel.stage<0?F.STAGES[(Math.random()*5)|0]:F.STAGES[sel.stage];
  if(mode==='arcade'){startArcade(sel.pick[0]);return;}
  startFight({mode:mode==='training'?'training':'versus',p1:sel.pick[0],p2:sel.pick[1],stage:st,cpu:[false,mode==='versus'],lvl:[diff,diff],two:mode==='versus2p'});}
function startArcade(suit){const pool=F.ROSTER.slice(0,8).filter(x=>x!==suit);let s=(Math.random()*1e9)|0;
  const R=()=>(s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296;for(let i=pool.length-1;i>0;i--){const j=(R()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]];}
  ARC={suit,rung:0,autos:pool,base:diff,cont:0};GS='vs';endT=0;}
function arcFoe(){const r=F.LADDER[ARC.rung];return r.foe.startsWith('auto')?ARC.autos[+r.foe.slice(4)]:r.foe;}
function arcFight(){const r=F.LADDER[ARC.rung],lv=clamp(ARC.base+(ARC.rung>=3?1:0)+(ARC.rung===7?1:0),0,3);
  startFight({mode:'arcade',p1:ARC.suit,p2:arcFoe(),stage:r.stage,cpu:[false,true],lvl:[lv,lv]});}
function onMatchOver(){
  if(cfg.mode==='demo'){toTitle();return;}
  GS='results';endT=0;resultI=0;if(window.CKBoot)CKBoot.hold(900);}

/* ============================ MENU KEYS ============================ */
const isUp=c=>c==='ArrowUp'||c==='KeyW',isDn=c=>c==='ArrowDown'||c==='KeyS',isL=c=>c==='ArrowLeft'||c==='KeyA',isR=c=>c==='ArrowRight'||c==='KeyD';
const isOk=c=>c==='Enter'||c==='Space'||c==='KeyJ'||c==='KeyZ'||c==='Numpad1'||c==='Comma',isBack=c=>c==='Escape'||c==='Backspace';
function menuKey(code,pad){
  idleT=0;
  if(GS==='boot')return;                                         // CK BOOT STANDARD: the ident plays out
  if(DEMO){DEMO=false;toTitle();return;}                            // any press ends the attract demo -> the title
  if(GS==='title'){if(isOk(code)||code==='Enter'){GS='menu';SFX.ok();}return;}
  if(GS==='menu'){
    if(isUp(code)){menuI=(menuI+MENU.length-1)%MENU.length;SFX.ui();}
    else if(isDn(code)){menuI=(menuI+1)%MENU.length;SFX.ui();}
    else if(isL(code)&&menuI<3){diff=(diff+3)%4;SFX.ui();}else if(isR(code)&&menuI<3){diff=(diff+1)%4;SFX.ui();}
    else if(isBack(code))toTitle();
    else if(isOk(code)){SFX.ok();const it=MENU[menuI];
      if(it==='ARCADE')newSel('arcade');else if(it==='VERSUS CPU')newSel('versus');else if(it==='VERSUS 2P')newSel('versus2p');
      else if(it==='TRAINING')newSel('training');else if(it==='MOVE LIST'){mlFrom='menu';mlScroll=0;GS='movelist';}
      else if(it==='HOW TO PLAY'){howFrom='menu';GS='howto';}
      else if(it.startsWith('SQUAD WAVES'))location.href='waves.html'+(QS.get('from')?'?from='+QS.get('from'):'');}
    return;}
  if(GS==='howto'){if(isBack(code)||isOk(code)){if(howFrom==='pause')GS='fight';else GS='menu';}return;}
  if(GS==='movelist'){const ids=F.ROSTER;
    if(isL(code)){mlId=ids[(ids.indexOf(mlId)+ids.length-1)%ids.length];mlScroll=0;SFX.ui();}
    else if(isR(code)){mlId=ids[(ids.indexOf(mlId)+1)%ids.length];mlScroll=0;SFX.ui();}
    else if(isUp(code))mlScroll=Math.max(0,mlScroll-1);else if(isDn(code))mlScroll=Math.min(8,mlScroll+1);
    else if(isBack(code)||isOk(code)){GS=mlFrom==='pause'?'fight':'menu';}
    return;}
  if(GS==='select'){selectKey(code);return;}
  if(GS==='vs'){if(endT>40&&(isOk(code)||code==='Enter'))arcFight();else if(isBack(code)&&endT>40)toTitle();return;}
  if(GS==='fight'){
    if(paused){pauseKey(code);return;}
    if(code==='Escape'||code==='KeyP'){paused=true;pauseI=0;pauseSub='';SFX.ui();return;}
    if(cfg.mode==='training'){if(code==='Tab')TR.hit=!TR.hit;if(code==='KeyR'||code==='Backspace')resetTraining();if(code==='KeyT')TR.dummy=DUMMIES[(DUMMIES.indexOf(TR.dummy)+1)%DUMMIES.length];}
    return;}
  if(GS==='results'){if(window.CKBoot&&CKBoot.held())return;if(endT<54)return;                         // CK BOOT: ~0.9 s results hold
    const opts=resultOpts();
    if(isUp(code))resultI=(resultI+opts.length-1)%opts.length;else if(isDn(code))resultI=(resultI+1)%opts.length;
    else if(isOk(code)){SFX.ok();doResult(opts[resultI]);}else if(isBack(code))toTitle();return;}
  if(GS==='ending'){if(endT>120&&(isOk(code)||isBack(code)))toTitle();return;}
}
function resultOpts(){
  if(cfg.mode==='arcade'){const won=M.winner===0;if(won)return ARC.rung+1>=F.LADDER.length?['THE END']:['NEXT DUEL','QUIT TO TITLE'];return ['CONTINUE','QUIT TO TITLE'];}
  return ['REMATCH','CHARACTER SELECT','MAIN MENU'];}
function doResult(o){
  if(o==='NEXT DUEL'){ARC.rung++;GS='vs';endT=0;}
  else if(o==='THE END'){SAVE.clear=1;if(ARC.base>=3)SAVE.hardest=1;save();GS='ending';endT=0;}
  else if(o==='CONTINUE'){ARC.cont++;GS='vs';endT=0;}
  else if(o==='REMATCH')startFight(Object.assign({},cfg,{seed:0}));
  else if(o==='CHARACTER SELECT')newSel(mode);
  else if(o==='MAIN MENU'){GS='menu';}else toTitle();}

/* ---- character select ---- */
const GRID_COLS=7;
function selectKey(code){
  const ids=F.ROSTER,n=ids.length,two=mode==='versus2p';
  if(sel.step===2){                                            // the stage
    if(isL(code)||code==='ArrowLeft'){sel.stage=sel.stage<=-1?4:sel.stage-1;SFX.ui();}
    else if(isR(code)||code==='ArrowRight'){sel.stage=sel.stage>=4?-1:sel.stage+1;SFX.ui();}
    else if(isOk(code)){SFX.ok();beginFromSelect();}
    else if(isBack(code)){sel.step=1;sel.pick[1]=null;sel.ready[1]=false;if(two){sel.ready=[false,false];sel.step=0;}}
    return;}
  // which cursor does this key move?
  const p2key=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Numpad1','Comma','Enter'].includes(code);
  let who=two?(p2key?1:0):sel.who;
  if(two&&sel.ready[who]&&!isBack(code))return;

  const h=two?(who?{l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown'}:{l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS'}):null;
  const L_=two?code===h.l:isL(code),R_=two?code===h.r:isR(code),U_=two?code===h.u:isUp(code),D_=two?code===h.d:isDn(code);
  if(L_)mv(-1);else if(R_)mv(1);else if(U_)mv(-GRID_COLS);else if(D_)mv(GRID_COLS);
  else if((two&&((who===0&&(code==='KeyJ'||code==='Space'))||(who===1&&(code==='Numpad1'||code==='Comma'||code==='Enter'))))||(!two&&isOk(code))){

    if(sel.who===1){sel.who=0;sel.pick[0]=null;}else GS='menu';}

let slow=0;
function fightTick(){
  const E=M.E;
  if(M.phase==='ko'&&M.pt<45){if(++slow%3)return;}           // KO slow-motion (render pacing only; the sim steps the same)
  const solo=!cfg.two;
  const ins=[0,1].map(s=>{
    if(cfg.cpu[s])return QA.idleCpu?{}:F.cpu(E,s,cfg.lvl[s]);
    if(cfg.mode==='training'&&s===1)return F.dummy(E,1,TR.dummy);
    return sideInput(s,solo&&s===0);});
  if(cfg.mode==='training')logInput(E,ins[0]);
  M.step(ins[0],ins[1]);onEvents(M.events);
  if(M.over){endT++;if(endT>70)onMatchOver();}
  if(DEMO&&++demoT>50*60)toTitle();}

  if(paused)drawPause();}

/* ============================ LOOP ============================ */
let lastT=0,acc=0;
function loop(now){requestAnimationFrame(loop);
  const dt=Math.min(100,now-(lastT||now));lastT=now;acc+=dt;let steps=0;
  while(acc>=1000/60&&steps<4){acc-=1000/60;steps++;tick();}
  render();}
function tick(){frame++;pollPadMenus();
  if(GS==='boot'){if(++bootT>170){GS='title';if(window.CKBoot)CKBoot.release();}return;}
  if(GS==='title'&&ATTRACT_F>0&&++idleT>ATTRACT_F)startDemo();
  if(GS==='fight'&&!paused)fightTick();
  if(GS==='vs'||GS==='results'||GS==='ending')endT++;
  tickFX();}
function render(){X.imageSmoothingEnabled=true;
  switch(GS){case 'boot':drawBoot();break;case 'title':drawTitle();break;case 'menu':drawMenu();break;case 'select':drawSelect();break;
    case 'vs':drawVS();break;case 'fight':drawFight();break;case 'results':drawResults();break;case 'ending':drawEnding();break;
    case 'movelist':drawMovelist();break;case 'howto':drawHow();break;}}
