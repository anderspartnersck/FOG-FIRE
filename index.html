     FOG AND FIRE: THE LUNAR PACT — a Castle Killscreen CO-OP mech action game.

X.imageSmoothingEnabled=false;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);
  C.style.width=((W*s)|0)+'px';C.style.height=((H*s)|0)+'px';}
addEventListener('resize',fit);fit();
let _seed=1337;function rnd(){_seed=(_seed*1664525+1013904223)&0x7fffffff;return _seed/0x7fffffff;}
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))e.preventDefault();

/* ============================ CONSTANT-WAR BACKGROUND ============================ */
const war=[];let stage=THEATERS[0],fog=0;
function seedWar(s){war.length=0;_seed=99;
  const n=s.mode==='siege'?9:s.mode==='horror'?5:6;
  for(let i=0;i<n;i++)war.push({k:'farmech',x:rnd()*W,y:GROUND-40-rnd()*20,
    sc:0.16+rnd()*0.12,vx:(s.mode==='siege'?0.18:0.06)*(rnd()<.5?1:-1),c:s.accent,ph:rnd()*6.28});}
function tickWar(s){
  if(rnd()<(s.mode==='siege'?0.22:0.10))war.push({k:'tracer',x:rnd()*W,y:rnd()*GROUND*0.6,
    vx:(rnd()-0.5)*6,vy:(rnd()-0.5)*2,life:40,c:rnd()<.3?'#fff':s.accent});
  if(rnd()<0.04)war.push({k:'burst',x:rnd()*W,y:rnd()*GROUND*0.55,r:2,life:26,c:s.accent});
  if(s.mode==='horror'&&rnd()<0.05)war.push({k:'spore',x:rnd()*W,y:GROUND,vy:-0.6-rnd(),life:120,c:'#ff5bc8'});
  for(const a of war){if(a.k==='farmech'){a.x+=a.vx;if(a.x<-60)a.x=W+60;if(a.x>W+60)a.x=-60;a.ph+=0.04;}
    else if(a.k==='tracer'){a.x+=a.vx;a.y+=a.vy;a.life--;}
    else if(a.k==='burst'){a.r+=1.6;a.life--;}
    else if(a.k==='spore'){a.y+=a.vy;a.x+=Math.sin(a.y*0.05)*0.4;a.life--;}}
  for(let i=war.length-1;i>=0;i--)if(war[i].life<=0)war.splice(i,1);}
function drawWar(t,s){
  const g=X.createLinearGradient(0,0,0,GROUND);g.addColorStop(0,s.sky[0]);g.addColorStop(1,s.sky[1]);
  X.fillStyle=g;X.fillRect(0,0,W,GROUND);
  _seed=7;X.globalAlpha=.5;for(let i=0;i<70;i++){X.fillStyle=rnd()<.2?s.accent:'#aab4c8';X.fillRect(rnd()*W,rnd()*GROUND*0.8,1,1);}X.globalAlpha=1;
  if(s.mode==='dome'||s.mode==='venus'){X.strokeStyle='rgba(127,208,255,.18)';X.lineWidth=2;
    X.beginPath();X.arc(W/2,GROUND+260,540,Math.PI,Math.PI*2);X.stroke();}
  if(s.mode==='siege'){X.fillStyle='#1a0d08';X.beginPath();X.moveTo(0,GROUND);X.lineTo(W*0.35,GROUND*0.25);
    X.lineTo(W*0.62,GROUND*0.55);X.lineTo(W,GROUND*0.2);X.lineTo(W,GROUND);X.fill();}
  if(s.mode==='pod'){ // POD 19 — fight OVER THE POD; Phaser MCs in the crowd (BG NPC, comic relief)
    for(let r=0;r<4;r++){X.fillStyle=`rgba(40,18,40,${0.85-r*0.15})`;X.fillRect(0,40+r*20,W,18);}
    _seed=51;for(let i=0;i<150;i++){X.fillStyle=rnd()<.5?'#5a2a4a':'#7a3a5a';X.fillRect(rnd()*W,42+rnd()*80,2,2);}
    for(let i=0;i<3;i++){const lx=W*(0.2+0.3*i)+Math.sin(t*0.0006+i)*120;X.fillStyle='rgba(255,91,200,.05)';
      X.beginPath();X.moveTo(lx,0);X.lineTo(lx-70,GROUND);X.lineTo(lx+70,GROUND);X.fill();}
    X.fillStyle='#15171c';X.fillRect(W-92,GROUND-52,38,52);X.fillStyle='#ffcf33';X.fillRect(W-88,GROUND-48,30,8);
    X.fillStyle='#ff2b6b';X.fillRect(W-76,GROUND-60,4,9);}
  for(const a of war){
    if(a.k==='farmech'){X.save();X.translate(a.x,a.y);X.scale(a.sc,a.sc);const sw=Math.sin(a.ph)*6;
      X.fillStyle='rgba(10,12,18,.85)';X.fillRect(-18,-60,36,60);X.fillRect(-26,-40,12,46+sw);
      X.fillRect(14,-40,12,46-sw);X.fillRect(-14,0,10,40);X.fillRect(4,0,10,40);
      X.fillStyle=a.c;X.globalAlpha=.6;X.fillRect(-8,-52,16,10);X.globalAlpha=1;X.restore();}
    else if(a.k==='tracer'){X.globalAlpha=Math.min(1,a.life/40);X.strokeStyle=a.c;X.lineWidth=1;
      X.beginPath();X.moveTo(a.x,a.y);X.lineTo(a.x-a.vx*3,a.y-a.vy*3);X.stroke();X.globalAlpha=1;}
    else if(a.k==='burst'){X.globalAlpha=Math.max(0,a.life/26);X.fillStyle=a.c;X.beginPath();X.arc(a.x,a.y,a.r,0,7);X.fill();
      X.globalAlpha=Math.max(0,a.life/52);X.fillStyle='#fff';X.beginPath();X.arc(a.x,a.y,a.r*0.4,0,7);X.fill();X.globalAlpha=1;}
    else if(a.k==='spore'){X.globalAlpha=Math.max(0,a.life/120)*0.7;X.fillStyle=a.c;X.fillRect(a.x,a.y,2,2);X.globalAlpha=1;}
  }
  const gg=X.createLinearGradient(0,GROUND,0,H);gg.addColorStop(0,'#11141c');gg.addColorStop(1,'#05060a');
  X.fillStyle=gg;X.fillRect(0,GROUND,W,H-GROUND);
  X.strokeStyle='rgba(127,208,255,.12)';X.beginPath();X.moveTo(0,GROUND+1);X.lineTo(W,GROUND+1);X.stroke();
  const fg=fog*(0.5+0.5*Math.sin(t*0.0009));
  if(fg>0.01){X.fillStyle=`rgba(150,160,180,${0.10*fg})`;X.fillRect(0,0,W,H);
    X.fillStyle=`rgba(120,130,150,${0.16*fg})`;X.fillRect(0,GROUND-120,W,160);}
}

/* ============================ PROCEDURAL MECH ============================ */
function drawMech(f){
  const cfg=f.cfg,[c1,c2,c3]=cfg.col,dir=f.face;
  X.save();X.translate(f.x,f.y);X.scale(dir,1);
  const t=f.animT;let lean=0,armEx=0,knee=0,headY=0;
  if(f.state==='walk'){knee=Math.sin(t*0.3)*4;lean=2;}
  if(f.state==='jab'){armEx=26-Math.abs(f.atkT-6)*2.2;lean=6;}
  if(f.state==='heavy'){armEx=34-Math.abs(f.atkT-9)*2.2;lean=9;headY=2;}
  if(f.state==='spec'){armEx=40;lean=12;}
  if(f.state==='hit'){lean=-10;headY=3;}
  if(f.state==='down'){X.rotate(-1.3*dir);}
  const glow=(f.state==='spec')?c2:null;
  const base=f.scaleBase||1,grow=(f.bigT>0?2.4:1),S=(cfg.boss?1.5:1)*base*grow;
  X.save();X.scale(1/dir,1);X.fillStyle='rgba(0,0,0,.4)';X.beginPath();X.ellipse(0,4,30*(cfg.boss?1.6:1)*base*grow,8,0,0,7);X.fill();X.restore();
  if(f.bigT>0){X.globalAlpha=.18;X.fillStyle=c2;X.beginPath();X.arc(0,-60*S,70*S,0,7);X.fill();X.globalAlpha=1;}
  X.scale(S,S);
  X.fillStyle=c3;X.fillRect(-18,-56,14,56+knee);X.fillStyle=c1;X.fillRect(2,-56,14,56-knee);
  X.fillStyle='rgba(255,255,255,.12)';X.fillRect(2,-56,4,56-knee);
  X.fillStyle=c3;X.fillRect(-20,-2,20,6);X.fillRect(2,-2,20,6);
  const ty=-120+lean*0.3;X.fillStyle=c1;
  if(cfg.build==='heavy')rrect(-26,ty,52,70,6);
  else if(cfg.build==='slim')rrect(-18,ty,36,66,5);
  else if(cfg.build==='aqua')rrect(-20,ty,40,64,14);
  else if(cfg.build==='gravity')poly([[-22,ty+8],[22,ty+8],[16,ty+70],[-16,ty+70],[-26,ty+40]]);
  else if(cfg.build==='horror')rrect(-22,ty,44,70,18);
  else if(cfg.build==='ninja')rrect(-12,ty+8,24,52,7);
  else if(cfg.build==='jank')rrect(-22,ty+2,42,66,5);
  X.fillStyle=c2;X.globalAlpha=.9;X.fillRect(-6,ty+22,12,6);X.globalAlpha=1;
  X.fillStyle='rgba(255,255,255,.10)';X.fillRect(-18,ty,5,66);
  X.fillStyle=c3;X.fillRect(-30,ty+6,12,16);X.fillRect(18,ty+6,12,16);
  X.fillStyle=c1;X.fillRect(-30,ty+18,10,30);
  X.fillStyle=c2;X.fillRect(20,ty+18,10+armEx,12);
  if(cfg.build==='heavy')X.fillRect(20+armEx,ty+14,14,20);
  if(cfg.build==='gravity'){X.fillStyle=c2;X.fillRect(20,ty+22,30+armEx,4);}
  if(f.id==='angie'){X.fillStyle=c2;X.fillRect(20+armEx,ty+10,4,28);}
  X.fillStyle=c3;const hy=ty-14+headY;
  if(cfg.build==='horror'){poly([[-12,hy+12],[0,hy-6],[12,hy+12],[6,hy+16],[-6,hy+16]]);
    X.fillStyle=c2;X.fillRect(-6,hy+4,4,3);X.fillRect(2,hy+4,4,3);}
  else if(cfg.build==='ninja'){rrect(-8,hy+3,16,13,5);X.fillStyle=glow||c2;X.fillRect(-7,hy+7,14,3);
    X.fillStyle=c1;poly([[8,hy+9],[24,hy+5],[12,hy+16]]);}
  else{rrect(-11,hy,22,16,3);X.fillStyle=glow||c2;X.fillRect(-9,hy+5,18,4);
    if(cfg.build==='slim'||cfg.build==='aqua'){X.fillStyle=c2;X.fillRect(-1,hy-8,2,9);
      poly([[-9,hy],[-2,hy-2],[-2,hy+2]]);poly([[9,hy],[2,hy-2],[2,hy+2]]);}}
  if(cfg.build==='jank'){ // turntable chest · speaker shoulder · busted antenna — moon-scrap
    X.fillStyle=c2;X.beginPath();X.arc(2,ty+36,9,0,7);X.fill();X.fillStyle=c3;X.beginPath();X.arc(2,ty+36,3,0,7);X.fill();
    X.fillStyle=c3;X.beginPath();X.arc(-30,ty+14,12,0,7);X.fill();X.fillStyle=c1;X.beginPath();X.arc(-30,ty+14,6,0,7);X.fill();
    X.strokeStyle=c2;X.lineWidth=2;X.beginPath();X.moveTo(8,ty-16);X.lineTo(16,ty-32);X.lineTo(11,ty-40);X.stroke();
    X.fillStyle='#ff2b6b';X.fillRect(9,ty-44,4,4);}
  if(glow){X.globalAlpha=.25;X.fillStyle=glow;X.beginPath();X.arc(0,ty+30,60,0,7);X.fill();X.globalAlpha=1;}
  X.restore();
  if(cfg.meter==='fire'&&f.meter>60){X.save();X.globalAlpha=(f.meter-60)/120;X.fillStyle=cfg.col[1];
    X.translate(f.x,f.y);X.fillRect(-26,-128,52,72);X.restore();}
}
function rrect(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);
  X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.fill();}
function poly(p){X.beginPath();X.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)X.lineTo(p[i][0],p[i][1]);X.closePath();X.fill();}

/* ============================ ACTOR (heroes + foes share this) ============================ */
const MOVES={
  jab  :{dur:12,hit:[4,8], range:80, dmg:6, gain:6, knock:4},
  heavy:{dur:24,hit:[7,13],range:100,dmg:13,gain:9, knock:10},
  spec :{dur:36,hit:[10,26],range:170,dmg:26,gain:0, knock:20,spec:true,aoe:true},
};
/* SIGNATURE SPECIALS — one kit per archetype (the felt difference, not just color).
   Each is a `spec` move; flags drive behavior in startAtk/takeHit:
   aoe=sweep all · dash=blink onto the target · proj=fire shot(s) · pull=drag in ·
   dot=leave poison · armor=brace (halve incoming) · heal=self-mend. id-cased
   pilots (solitaire GET BIG, phaser DROP THE NEEDLE) layer ON TOP of their arch. */
const ARCH_SPEC={
  BREACHER  :{dur:34,hit:[12,20],range:150,dmg:24,gain:0,knock:24,spec:true,aoe:true, dash:true, fx:'#caa01a'}, // SULFUR BURROW — erupt under them
  PYRO      :{dur:42,hit:[10,32],range:240,dmg:22,gain:0,knock:14,spec:true,aoe:true,             fx:'#ff3b2f'}, // ATMODOME FLASH — wide self-burning field
  ZONER     :{dur:30,hit:[8,12], range:120,dmg:12,gain:0,knock:26,spec:true,aoe:true, proj:{n:3,spread:30,speed:9,dmg:14}, fx:'#3affe0'}, // TIDAL DRUM / WATERSPOUT — jets
  LIFTER    :{dur:34,hit:[12,18],range:78, dmg:44,gain:0,knock:30,spec:true,aoe:false,            fx:'#e0a92e'}, // DEADLIFT — one crushing single grab
  HAZARD    :{dur:34,hit:[10,22],range:150,dmg:16,gain:0,knock:10,spec:true,aoe:true, dot:240,    fx:'#9bff5b'}, // TOXIN VENT — poison lingers
  DUELIST   :{dur:28,hit:[8,16], range:140,dmg:26,gain:0,knock:14,spec:true,aoe:false,dash:true,  fx:'#ff2b6b'}, // IMPALER — dash-stab
  ASSASSIN  :{dur:28,hit:[10,18],range:150,dmg:22,gain:0,knock:18,spec:true,aoe:true,             fx:'#7fd0ff'}, // GET BIG / WAVE PULSE — quick pulse (id adds GET BIG)
  ANCHOR    :{dur:38,hit:[14,22],range:120,dmg:20,gain:0,knock:34,spec:true,aoe:true, armor:120,  fx:'#7a8a3a'}, // OLD IRON — braced slam, holds the line
  SKIRMISHER:{dur:26,hit:[8,14], range:120,dmg:18,gain:0,knock:16,spec:true,aoe:false,dash:true,  fx:'#9bff5b'}, // PHASE DASH — hit & run
  LANCER    :{dur:34,hit:[12,20],range:210,dmg:16,gain:0,knock:24,spec:true,aoe:true, pull:true,  fx:'#b14bff'}, // BORROWED GRAVITY — drag them in
  WILDCARD  :{dur:36,hit:[10,26],range:170,dmg:20,gain:0,knock:18,spec:true,aoe:true,             fx:'#ffcf33'}, // DROP THE NEEDLE — id spins the record
  RAILGUN   :{dur:34,hit:[8,12], range:120,dmg:18,gain:0,knock:20,spec:true,aoe:false,proj:{n:1,spread:0,speed:16,dmg:34,pierce:true}, fx:'#b14bff'}, // RAIL COLLAPSE — piercing beam
  ZEALOT    :{dur:34,hit:[10,22],range:180,dmg:20,gain:0,knock:16,spec:true,aoe:true, heal:24,    fx:'#a02a4a'}, // GREATER GOOD — AoE + self-mend
  BRAWLER   :{dur:36,hit:[14,20],range:96, dmg:38,gain:0,knock:40,spec:true,aoe:false,            fx:'#e0a92e'}, // BIGGEST TIE — one huge slam
};
/* BOSS PATTERNS — puzzle bosses, not HP sponges. Each move TELEGRAPHS (a windup +
   danger-zone marker the player can read) then strikes; the boss cycles them and
   speeds up by PHASE (>66% hp · 33-66% · <33% frenzy). kind: aoe=front slam ·
   proj=ranged shots · pull=gravity drag-in · charge=lunge across the arena. */
const BOSS_MOVES={
  MORNING:[ // KYLE — MORNING STAR (gravity/rail) — controls space, punishes greed
    {name:'RAIL VOLLEY',  cue:'RAIL LOCK',      tele:28, kind:'proj',  proj:{n:3,spread:24,speed:13,dmg:13}, dur:26},
    {name:'GRAV SLAM',    cue:'GRAVITY RISING', tele:34, kind:'aoe',   range:165, dmg:20, knock:30, dur:34, mark:1},
    {name:'GRAVITY WELL', cue:'WELL OPENING',   tele:30, kind:'pull',  range:280, dmg:10, knock:24, dur:30, mark:1},
  ],
  HYBRID:[ // THE HYBRID COMMANDER (bio-beast) — up-close bruiser with spores
    {name:'TAIL SWEEP',   cue:'IT REARS BACK',      tele:24, kind:'aoe',   range:150, dmg:18, knock:28, dur:30, mark:1},
    {name:'SPORE SPIT',   cue:'GLANDS SWELLING',    tele:30, kind:'proj',  proj:{n:4,spread:20,speed:9,dmg:10,dot:200}, dur:30},
    {name:'GORE CHARGE',  cue:'IT LOWERS ITS HORNS',tele:30, kind:'charge',range:130, dmg:22, knock:34, dur:28},
  ],
};
function bossKey(name){return (name||'').indexOf('KYLE')>=0?'MORNING':(name||'').indexOf('HYBRID')>=0?'HYBRID':null;}
class Actor{
  constructor(cfg,x,team){this.cfg=cfg;this.id=cfg.id||'foe';this.team=team;
    this.x=x;this.y=GROUND;this.vx=0;this.vy=0;this.face=team==='hero'?1:-1;
    this.state='idle';this.animT=rnd()*30|0;this.atkT=0;this.atkMove=null;
    this.maxhp=cfg.hp||100;this.hp=this.maxhp;this.meter=0;this.air=false;
    this.hitLock=0;this.blocking=false;this.hitThisAtk=false;this.flash=0;
    this.down=false;this.downT=0;this.dead=false;this.aiCd=20+rnd()*40|0;
    this.scaleBase=(cfg.build==='ninja')?0.6:1;this.bigT=0;this._tp=null;this.dmgMul=1;
    this.poisonT=0;this.armorT=0;   // HAZARD toxin DoT · ANCHOR brace
    this.bphase=0;this.windup=0;this.bmove=null;this.bossCd=40+rnd()*30|0;   // boss pattern state
    // jumps: heavies get ONE big heavy-up-jump; gravity 2; flyers (slim/aqua/ninja) TRIPLE
    this.maxJumps=(cfg.build==='heavy')?1:(cfg.build==='gravity')?2:3;
    this.jumps=0;this.upHeld=false;this.chain=0;}
  startAtk(name){
    if(this.hitLock>0||this.down||this.state==='hit')return;
    if(name==='jab')this.chain=(this.state==='jab')?Math.min(3,this.chain+1):1;else this.chain=0;
    this.state=name;this.atkMove=MOVES[name];this.atkT=0;this.hitThisAtk=false;
    if(name==='spec'){
      const sm=ARCH_SPEC[this.cfg.arch]||MOVES.spec;this.atkMove=sm;      // signature kit per archetype
      if(this.cfg.meter==='fire')this.hp=Math.max(1,this.hp-8);
      this.meter=0;specFX(this);announce(SPEC[this.id]||(this.cfg.spec+'!'));
      if(sm.dash&&this._tp!=null){                         // BREACHER/DUELIST/SKIRMISHER — blink onto the target
        this.x=Math.max(60,Math.min(W-60,this._tp-this.face*64));spark(this.x,this.y-50,sm.fx||'#fff',22);}
      if(sm.proj)specShoot(this,sm.proj);                  // ZONER/RAILGUN — fire jets / a piercing beam
      if(sm.heal)this.hp=Math.min(this.maxhp,this.hp+sm.heal);            // ZEALOT — the greater good
      if(sm.armor)this.armorT=sm.armor;                    // ANCHOR — brace, hold the line
      if(this.id==='solitaire'){this.bigT=300;            // GET BIG — the polymer: big but light
        if(this._tp!=null)this.x=Math.max(60,Math.min(W-60,this._tp-this.face*70)); // teleport blink in
        spark(this.x,this.y-60,'#7fd0ff',34);}
      if(this.id==='phaser'){                              // DROP THE NEEDLE — spin a random record (sleeper RNG)
        const cues=['PARTY TIME','BOO-YAH!','KISS CAM','SHOW’S OVER','INTERMISSION'];
        const cue=cues[Math.floor(rnd()*cues.length)];announce('♪ '+cue+' ♪');
        if(cue==='PARTY TIME'){this.hp=Math.min(this.maxhp,this.hp+22);spark(this.x,this.y-70,'#ffcf33',30);}
        else if(cue==='KISS CAM'){for(const o of (this._foes||[])){if(o.team!==this.team&&!o.dead&&Math.abs(o.x-this.x)<220){o.hitLock=70;o.state='hit';o.atkMove=null;spark(o.x,o.y-70,'#ff2b6b',16);break;}}}
        else if(cue==='INTERMISSION'){this.atkMove={dur:28,hit:[99,99],range:0,dmg:0,gain:0,knock:0};this.hitLock=6;}}}
  }
  update(input,foes){
    this._foes=foes;
    this.animT++;if(this.flash>0)this.flash--;if(this.bigT>0)this.bigT--;if(this.armorT>0)this.armorT--;
    if(this.poisonT>0&&!this.dead){this.poisonT--;                 // HAZARD toxin — gentle drain, no stun
      if(this.poisonT%26===0&&!this.down){this.hp=Math.max(0,this.hp-3);this.flash=2;spark(this.x,this.y-50,'#9bff5b',4);
        if(this.hp<=0){this.poisonT=0;
          if(this.team==='hero'){this.down=true;this.downT=360;this.state='down';this.vy=-6;this.vx=0;announce(this.cfg.pilot+' IS DOWN — REVIVE!');}
          else{this.dead=true;spark(this.x,this.y-70,this.cfg.col[1],20);score+=10;}
          return;}}}
    if(this.down){this.downT--;this.vx*=0.85;this.x+=this.vx;
      if(this.team==='hero'&&this.downT<=0){/* stays down until revived or timeout KO */
        if(this.downT<-300){this.dead=true;}}
      return;}
    if(this.hitLock>0){this.hitLock--;this.x+=this.vx;this.vx*=0.82;
      if(this.hitLock===0&&this.state==='hit')this.state='idle';this.clamp();return;}
    if(this.atkMove){this.atkT++;const m=this.atkMove;
      // hero cancels: 1–3 jab chain · jab→heavy · any→special
      if(this.team==='hero'&&input&&this.atkT>=m.hit[0]){
        if(input.spec&&this.meter>=100){this._tp=nearestFoeX(this,foes);this.startAtk('spec');return;}
        else if(this.state==='jab'&&input.heavy){this.startAtk('heavy');return;}
        else if(this.state==='jab'&&input.jab&&this.chain<3){this.startAtk('jab');return;}
      }
      if(this.atkT>=m.hit[0]&&this.atkT<=m.hit[1]){
        const big=this.bigT>0,er=m.range*(big?1.7:1),em=big?{...m,dmg:Math.round(m.dmg*1.8),knock:m.knock*1.4}:m;
        // AOE: sweep ALL targets ONCE on the first active frame. Non-AOE: first target, once.
        if(m.aoe){ if(this.atkT===m.hit[0]) for(const o of foes){
            if(o.dead||(o.down&&o.team!=='hero')||o.team===this.team)continue;
            const dx=(o.x-this.x)*this.face,ady=Math.abs(o.y-this.y);
            if(dx>-40&&dx<er&&ady<160){o.takeHit(em,this);if(m.dot)o.poisonT=m.dot;}} }
        else if(!this.hitThisAtk) for(const o of foes){
            if(o.dead||(o.down&&o.team!=='hero')||o.team===this.team)continue;
            const dx=(o.x-this.x)*this.face,ady=Math.abs(o.y-this.y);
            if(dx>-20&&dx<er&&ady<150){o.takeHit(em,this);if(m.dot)o.poisonT=m.dot;this.hitThisAtk=true;break;}}}
      if(this.atkT>=m.dur){this.atkMove=null;this.state='idle';}
      this.x+=this.vx;this.vx*=0.7;this.clamp();return;}
    if(this.team==='hero')this.heroMove(input,foes);else this.foeMove(foes);
    if(this.y<GROUND-0.5||this.vy<0){this.vy+=0.5;this.air=true;} // the polymer: LIGHTER THAN AIR — deep float
    this.x+=this.vx;this.y+=this.vy;
    if(this.y>=GROUND){this.y=GROUND;this.vy=0;this.air=false;this.jumps=0;}
    this.clamp();
  }
  heroMove(input,foes){
    const sp=3.4;this.blocking=input.block&&!this.air;
    if(this.blocking)this.state='block';
    else if(input.left){this.vx=-sp;this.face=-1;this.state='walk';}
    else if(input.right){this.vx=sp;this.face=1;this.state='walk';}
    else{this.vx=0;if(!this.air)this.state='idle';}
    if(input.up&&!this.upHeld){
      if(!this.air){this.air=true;this.jumps=1;this.vy=(this.cfg.build==='heavy')?-18:-12;} // heavy = one big HEAVY-UP-JUMP
      else if(this.jumps<this.maxJumps){this.jumps++;this.vy=-11;}                            // flyers: triple-jump
    }
    this.upHeld=input.up;
    if(this.air)this.state='idle';                       // gravity handled centrally (polymer float)
    if(!this.blocking){if(input.jab)this.startAtk('jab');
      else if(input.heavy)this.startAtk('heavy');
      else if(input.spec&&this.meter>=100){this._tp=nearestFoeX(this,foes);this.startAtk('spec');}}
    // revive: standing next to a downed ally
    if(input.up){} // (revive handled in game loop proximity)
  }
  foeMove(foes){
    if(this.cfg.boss)return this.bossTick(foes);
    // target nearest living hero
    let tgt=null,bd=1e9;
    for(const o of foes){if(o.team!=='hero'||o.down||o.dead)continue;
      const d=Math.abs(o.x-this.x);if(d<bd){bd=d;tgt=o;}}
    if(!tgt){this.vx=0;this.state='idle';return;}
    const dir=Math.sign(tgt.x-this.x)||1;this.face=dir;
    const reach=this.cfg.reach||50;
    this.aiCd--;
    if(bd>reach){this.vx=(this.cfg.sp||1.5)*dir;this.state='walk';}
    else{this.vx=0;this.state='idle';
      if(this.aiCd<=0){this.aiCd=this.cfg.boss?40:60+rnd()*60|0;
        if(this.cfg.ranged&&bd>reach*0.6){shoot(this);}
        else this.foeStrike();}}
    if(this.cfg.lunge&&bd<reach*3&&bd>reach&&this.aiCd<6&&!this.air){this.vy=-9;this.air=true;this.vx=dir*5;}
  }
  foeStrike(){const reach=this.cfg.reach||50;this.state='heavy';this.atkMove={
    dur:22,hit:[6,12],range:reach,dmg:this.cfg.dmg*this.dmgMul,gain:0,knock:this.cfg.boss?14:7};this.atkT=0;this.hitThisAtk=false;
    if(this.cfg.screech){announce('— SCREECH —');shake=8;}}
  bossTick(foes){                                   // telegraphed, phased PUZZLE boss
    let tgt=null,bd=1e9;
    for(const o of foes){if(o.team!=='hero'||o.down||o.dead)continue;
      const d=Math.abs(o.x-this.x);if(d<bd){bd=d;tgt=o;}}
    if(!tgt){this.vx=0;this.state='idle';return;}
    this.face=Math.sign(tgt.x-this.x)||this.face;
    const fr=this.hp/this.maxhp, ph=fr>0.66?1:fr>0.33?2:3;     // PHASES
    if(ph>this.bphase){this.bphase=ph;
      if(ph>1){announce((bossKey(this.cfg.name)==='MORNING'?'KYLE':'THE HIVE')+(ph>=3?' — FRENZY':' — PHASE '+ph));shake=10;
        this.flash=8;spark(this.x,this.y-90,this.cfg.col[1],26);}}
    if(this.windup>0){                                          // TELEGRAPH — read it, dodge it
      this.windup--;this.vx*=0.7;this.state='heavy';this.atkT=0;
      if(this.windup%5===0){const m=this.bmove;this.flash=Math.max(this.flash,3);spark(this.x,this.y-90,this.cfg.col[1],4);
        if(m&&m.mark!=null)spark(this.x+this.face*(m.range*0.6),this.y-6,'#ff4d4d',5);}  // ground danger marker
      if(this.windup===0&&this.bmove)this.commitBoss(this.bmove);
      return;}
    this.bossCd--;
    const want=(this.bmove&&this.bmove.kind==='proj')?260:(this.cfg.reach||80)*1.15;     // spacing: ranged keeps distance
    if(bd>want+30){this.vx=(this.cfg.sp||1.2)*this.face;this.state='walk';}
    else if(bd<want-50){this.vx=-(this.cfg.sp||1.2)*this.face*0.8;this.state='walk';}
    else{this.vx=0;this.state='idle';}
    if(this.bossCd<=0){
      const list=BOSS_MOVES[bossKey(this.cfg.name)]||[];
      if(list.length){const m=list[Math.floor(rnd()*list.length)];this.bmove=m;
        this.windup=Math.max(12,Math.round(m.tele*(this.bphase>=3?0.62:this.bphase>=2?0.8:1)));  // faster telegraphs each phase
        announce('⊳ '+m.cue+' —');
        this.bossCd=(this.bphase>=3?34:this.bphase>=2?52:74)+(rnd()*20|0);}
      else this.bossCd=60;}
  }
  commitBoss(m){
    this.bmove=null;this.flash=6;announce(m.name+'!');
    const d=Math.round((m.dmg||this.cfg.dmg)*(this.dmgMul||1));
    if(m.kind==='proj'){specShoot(this,m.proj);
      this.atkMove={dur:m.dur,hit:[99,99],range:0,dmg:0,gain:0,knock:0};}           // recovery only — projectiles carry the hit
    else if(m.kind==='charge'){this.vx=this.face*10;shake=8;
      this.atkMove={dur:m.dur,hit:[2,m.dur-6],range:m.range,dmg:d,gain:0,knock:m.knock};}
    else{shake=Math.min(12,m.knock*0.5);                                            // aoe / pull — front slam
      this.atkMove={dur:m.dur,hit:[3,9],range:m.range,dmg:d,gain:0,knock:m.knock,aoe:true,pull:m.kind==='pull'};}
    this.atkT=0;this.hitThisAtk=false;this.state='heavy';
  }
  takeHit(m,by){
    if(this.dead||this.down&&this.team==='hero')return;
    if(this.blocking&&!m.spec){this.hp=Math.max(0,this.hp-1);this.meter=Math.min(100,this.meter+3);
      this.vx=by.face*4;this.hitLock=6;spark(this.x,this.y-70,'#7fd0ff');return;}
    const armored=this.armorT>0&&!m.spec;                  // ANCHOR braces against non-special blows
    const dmg=this.blocking?Math.ceil(m.dmg*0.4):(armored?Math.ceil(m.dmg*0.5):m.dmg);
    this.hp=Math.max(0,this.hp-dmg);
    if(this.team==='hero'){hud.flash=6;}
    if(by.team==='hero'&&by.meter!=null)by.meter=Math.min(100,by.meter+(by.cfg.meter==='fire'?m.gain*0.6:m.gain));
    const kn=m.knock*(armored?0.4:1)*(m.pull?-0.6:1);      // LANCER pull drags toward the attacker
    this.vx=by.face*kn;this.vy=m.spec?-6:0;this.hitLock=m.spec?16:(armored?4:8);this.state='hit';
    this.atkMove=null;this.flash=6;this.face=(by.x>=this.x)?1:-1;
    spark(this.x,this.y-72,m.spec?by.cfg.col[1]:'#fff',m.spec?22:8);
    hitstop=m.spec?6:2;shake=Math.min(12,m.knock*0.7);
    if(this.hp<=0){
      if(this.team==='hero'){this.down=true;this.downT=360;this.state='down';this.vy=-8;this.vx=by.face*6;announce(this.cfg.pilot+' IS DOWN — REVIVE!');}
      else{this.dead=true;spark(this.x,this.y-70,this.cfg.col[1],26);score+=this.cfg.boss?500:10;
        if(this.cfg.boss)bossDown(this);}
    }
  }
  clamp(){this.x=Math.max(34,Math.min(W-34,this.x));}
}

function nearestFoeX(me,foes){let bx=null,bd=1e9;for(const o of foes){
  if(o.team===me.team||o.dead||o.down)continue;const d=Math.abs(o.x-me.x);if(d<bd){bd=d;bx=o.x;}}return bx;}

/* ============================ PROJECTILES ============================ */
const shots=[];
function shoot(a){shots.push({x:a.x+a.face*30,y:a.y-70,vx:a.face*6,dmg:a.cfg.dmg*(a.dmgMul||1),team:a.team,c:a.cfg.col[1],life:120});
  spark(a.x+a.face*30,a.y-70,a.cfg.col[1],6);}
function specShoot(a,proj){const n=proj.n||1;       // ZONER jets / RAILGUN piercing beam
  for(let i=0;i<n;i++){const off=(i-(n-1)/2)*(proj.spread||0);
    shots.push({x:a.x+a.face*30,y:a.y-70-off,vx:a.face*(proj.speed||8),dmg:(proj.dmg||a.cfg.dmg)*(a.dmgMul||1),
      team:a.team,c:a.cfg.col[1],life:150,knock:proj.knock||10,pierce:!!proj.pierce,hits:proj.pierce?new Set():null,dot:proj.dot||0});}
  spark(a.x+a.face*30,a.y-70,a.cfg.col[1],14);}
function tickShots(actors){for(const s of shots){s.x+=s.vx;s.life--;
  for(const o of actors){if(o.team===s.team||o.dead||o.down)continue;
    if(Math.abs(o.x-s.x)<28){
      if(s.hits){if(s.hits.has(o))continue;s.hits.add(o);}        // pierce: hit each target once
      o.takeHit({dmg:s.dmg,knock:s.knock||6},{face:Math.sign(s.vx)||1,team:s.team,cfg:{col:[s.c,s.c,s.c]}});
      if(s.dot)o.poisonT=s.dot;                                    // HYBRID spores poison on hit
      if(!s.pierce){s.life=0;break;}}}}
  for(let i=shots.length-1;i>=0;i--)if(shots[i].life<=0||shots[i].x<-20||shots[i].x>W+20)shots.splice(i,1);}
function drawShots(){for(const s of shots){X.fillStyle=s.c;X.fillRect(s.x-4,s.y-2,8,4);
  X.globalAlpha=.4;X.fillRect(s.x-10,s.y-1,8,2);X.globalAlpha=1;}}

/* ============================ FX / SCREEN ============================ */
const fx=[];let hitstop=0,shake=0;
function spark(x,y,c,n=8){for(let i=0;i<n;i++)fx.push({x,y,vx:(rnd()-0.5)*8,vy:(rnd()-0.7)*8,life:18+rnd()*10,c});}
function specFX(f){for(let i=0;i<46;i++)fx.push({x:f.x+f.face*30,y:f.y-70,vx:f.face*(2+rnd()*9),vy:(rnd()-0.5)*9,
  life:24+rnd()*16,c:rnd()<.5?f.cfg.col[1]:(f.cfg.meter==='fire'?'#ff3b2f':'#b14bff')});}
function tickFX(){for(const p of fx){p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life--;}
  for(let i=fx.length-1;i>=0;i--)if(fx[i].life<=0)fx.splice(i,1);}
function drawFX(){for(const p of fx){X.globalAlpha=Math.max(0,Math.min(1,p.life/20));X.fillStyle=p.c;X.fillRect(p.x,p.y,3,3);}X.globalAlpha=1;}

/* ============================ ANNOUNCER ============================ */
const SPEC={backdraft:'OPENING GASKETS. PRIMING.',namor:'DRUM-SOLO FROM MOBY DICK!',sandtrap:'I CAN SEE THROUGH YOU.',
  angie:'COME AND TAKE IT.',foxeylady:'GET BEHIND ME.',holyroller:'INTO THE VORTEX.',poison:'HOLD YOUR BREATH.',
  solitaire:'I AM ONE THROUGH SIX.',kyle:'YOU SHOULD HAVE LOOKED CLOSER.',morningstar:'GRAVITY IS NOT A SUGGESTION.',
  lesher:'NOT MY FIRST WAR.',dave:'SEE IT YOURSELF.',chow:'THANKS FOR THE TECH.',league:'FOR THE GREATER GOOD.',oldglory:'HELLO, CAKE.',
  phaser:'NEW GUY, DROP MY BEAT.'};
let bark='',barkT=0;function announce(s){bark=s;barkT=110;}

/* ============================ GAME STATE ============================ */
let GS='title';
let heroes=[],foes=[],theaterIdx=0,waveIdx=0,spawnQ=[],spawnT=0,score=0;
let selIdx=0,selP2=1,coop=false,p2cpu=true,blink=0,banner='',bannerT=0;
const hud={flash:0};
const DIFFS=[{n:'NORMAL',hp:1,dmg:1},{n:'HARD',hp:1.45,dmg:1.3},{n:'HARDEST',hp:1.9,dmg:1.7}];
let diffIdx=0,gameMode='campaign',seekWave=0;
let unlocks=(()=>{try{return JSON.parse(localStorage.getItem('faf_unlocks'))||{};}catch(e){return {};}})();
function saveUnlocks(){try{localStorage.setItem('faf_unlocks',JSON.stringify(unlocks));}catch(e){}}
function locked(p){return p.lock==='normal'?!unlocks.normal:p.lock==='hardest'?!unlocks.hardest:p.lock==='jailbreak'?!unlocks.jail:false;}

function menuKey(code){
  if(GS==='title'){if(code==='Enter'||code==='Space')GS='select';return;}
  if(GS==='select'){
    const cols=4,n=PILOTS.length;
    if(code==='Escape'){GS='title';return;}
    if(code==='KeyC'||code==='Tab'){coop=!coop;return;}
    if(code==='ArrowRight')selIdx=(selIdx+1)%n;
    if(code==='ArrowLeft')selIdx=(selIdx-1+n)%n;
    if(code==='ArrowDown')selIdx=(selIdx+cols)%n;
    if(code==='ArrowUp')selIdx=(selIdx-cols+n)%n;
    if(code==='KeyD')selP2=(selP2+1)%n;
    if(code==='KeyA')selP2=(selP2-1+n)%n;
    if(code==='KeyX'){diffIdx=(diffIdx+1)%DIFFS.length;return;}
    if(code==='KeyV'){gameMode=gameMode==='campaign'?'seek':'campaign';return;}
    if(code==='Enter'){if(locked(PILOTS[selIdx]))return;if(coop&&locked(PILOTS[selP2]))return;startCampaign();}
    return;}
  if(GS==='briefing'){if(code==='Enter'||code==='Space')startTheater(theaterIdx);return;}
  if(GS==='win'||GS==='gameover'){if(code==='Enter'){GS='select';}return;}
  if(GS==='play'&&code==='Escape')GS='select';
}

function startCampaign(){score=0;heroes=[];
  const a=new Actor(PILOTS[selIdx],W*0.30,'hero');a.input=1;heroes.push(a);
  if(coop){const b=new Actor(PILOTS[selP2],W*0.42,'hero');b.input=2;b.cpu=p2cpu;heroes.push(b);}
  if(gameMode==='seek'){startSeek();}else{theaterIdx=0;GS='briefing';bannerT=0;}}
function startSeek(){stage=THEATERS[3];seedWar(stage);fog=stage.fog||0.4;
  foes=[];shots.length=0;fx.length=0;seekWave=0;
  for(const h of heroes){h.x=W*0.3+(h.input===2?80:0);h.y=GROUND;h.hp=h.maxhp;h.down=false;h.dead=false;h.state='idle';h.meter=40;}
  nextSeekWave();GS='play';announce('SEEK AND DESTROY');}
function nextSeekWave(){seekWave++;
  const pool=['cultist','zealot','beast','screech','tank','widow','undertow','deadletter','anvil'];
  const variety=Math.min(pool.length,2+seekWave),n=2+Math.floor(seekWave*1.4);
  spawnQ=[];for(let i=0;i<n;i++)spawnQ.push(pool[Math.floor(rnd()*variety)]);
  if(seekWave%5===0)spawnQ.push(rnd()<0.5?'MORNING':'HYBRID');
  spawnT=20;}
function startTheater(i){stage=THEATERS[i];seedWar(stage);fog=stage.fog||0.2;
  waveIdx=0;foes=[];shots.length=0;fx.length=0;
  for(const h of heroes){h.x=W*0.3+ (h.input===2?80:0);h.y=GROUND;h.hp=h.maxhp;h.down=false;h.dead=false;h.state='idle';h.meter=Math.min(h.meter,40);}
  loadWave();GS='play';announce(stage.name.split('—')[0].trim());}
function loadWave(){const w=stage.waves[waveIdx];spawnQ=[...w];spawnT=20;}
function spawnTick(){if(spawnQ.length&&spawnT--<=0){const id=spawnQ.shift();
  const def=FOES[id];const fromLeft=rnd()<.5;
  const f=new Actor(def, fromLeft?-30:W+30,'foe');f.x=fromLeft?-30:W+30;
  const D=DIFFS[diffIdx],sk=gameMode==='seek'?1+seekWave*0.06:1;
  f.maxhp=Math.round(def.hp*D.hp*sk);f.hp=f.maxhp;f.dmgMul=D.dmg;
  foes.push(f);
  spawnT=def.boss?0:40+rnd()*30|0;}}
function bossDown(b){const nm=(b&&b.cfg&&b.cfg.name)||'';
  announce(nm.indexOf('KYLE')>=0?'KYLE BREAKS FOR THE DARK — THIS ISN’T OVER.':'THE HIVE NEVER CAME FOR HIM. HE WAS ALWAYS CARGO.');}

/* ============================ INPUT ============================ */
function readInput(which){
  if(which===1)return{left:keys['ArrowLeft'],right:keys['ArrowRight'],up:keys['ArrowUp'],
    block:keys['ArrowDown'],jab:keys['KeyA'],heavy:keys['KeyS'],spec:keys['KeyD']};
  return{left:keys['KeyF'],right:keys['KeyH'],up:keys['KeyT'],block:keys['KeyG'],
    jab:keys['KeyJ'],heavy:keys['KeyK'],spec:keys['KeyL']};
}
const pe={};
function edge(inp,tag){const o={...inp};for(const k of['jab','heavy','spec']){const id=tag+k;o[k]=inp[k]&&!pe[id];pe[id]=inp[k];}return o;}
function cpuAlly(me){const o={left:false,right:false,up:false,block:false,jab:false,heavy:false,spec:false};
  if(me.hitLock>0||me.atkMove||me.down)return o;
  let tgt=null,bd=1e9;for(const f of foes){if(f.dead||f.down)continue;const d=Math.abs(f.x-me.x);if(d<bd){bd=d;tgt=f;}}
  if(!tgt)return o;const dir=Math.sign(tgt.x-me.x)||1;
  if(bd>90){if(dir>0)o.right=true;else o.left=true;}
  else{if(me.meter>=100&&rnd()<0.4)o.spec=true;else if(rnd()<0.5)o.heavy=true;else o.jab=true;}
  return o;}

/* ============================ GAMEPAD (2P arcade controllers) ============================ */
/* self-contained, no external lib; pad0->P1 e.codes, pad1->P2 e.codes; exception-safe */
const PAD_MAP=[
  /* P1 */ {left:'ArrowLeft',right:'ArrowRight',up:'ArrowUp',block:'ArrowDown',jab:'KeyA',heavy:'KeyS',spec:'KeyD'},
  /* P2 */ {left:'KeyF',right:'KeyH',up:'KeyT',block:'KeyG',jab:'KeyJ',heavy:'KeyK',spec:'KeyL'}
];
const _padMenuPrev=[{},{}];   // previous menu-edge button state, per pad
let _pad2seen=false;          // once a 2nd pad shows up, P2 becomes human
function _padDir(gp){
  // returns {left,right,up,down} folded from stick / right-stick / d-pad / hat.
  // THE GHOST: lib/ghost.js normalizes every device (F300/8BitDo/any HID) into a
  // single virtual panel — dead axes self-filter, d-pad (btn 12-15) + POV hat fold
  // in, real axes survive. We keep this game's own 0.5 deadzone for the discrete
  // 8-way decision so feel is byte-identical to the old per-device code.
  const DZ=0.5,G=Ghost.read(gp),ax=G.ax,ay=G.ay;
  const left=ax<-DZ, right=ax>DZ, up=ay<-DZ, down=ay>DZ;
  return {left,right,up,down};
}
function pollPads(){
  let pads;try{pads=navigator.getGamepads?navigator.getGamepads():[];}catch(e){return;}
  if(!pads)return;
  // count connected -> arm P2-human when 2nd pad present
  let connected=0;for(let i=0;i<pads.length;i++)if(pads[i])connected++;
  if(connected>=2&&!_pad2seen){_pad2seen=true;p2cpu=false;}
  for(let p=0;p<2;p++){
    const gp=pads[p];if(!gp)continue;
    const map=PAD_MAP[p],b=gp.buttons||[];
    const bp=i=>!!(b[i]&&(b[i].pressed||b[i].value>0.5));
    try{
      const d=_padDir(gp);
      if(GS==='play'){
        keys[map.left]=d.left; keys[map.right]=d.right; keys[map.up]=d.up; keys[map.block]=d.down;
        keys[map.jab]=bp(0); keys[map.heavy]=bp(2); keys[map.spec]=bp(1);
      }else{
        // menu nav: edge-trigger -> menuKey()
        const prev=_padMenuPrev[p];
        const fire=(code,now)=>{if(now&&!prev[code])menuKey(code);prev[code]=now;};
        const start=bp(9)||bp(0); // start or A = Enter/confirm
        fire('ArrowLeft',d.left); fire('ArrowRight',d.right);
        fire('ArrowUp',d.up); fire('ArrowDown',d.down);
        fire('Enter',start);
        fire('Escape',bp(1)); // B = back
        fire('Tab',bp(8));    // select/back = coop toggle
        fire('KeyX',bp(3));   // Y = difficulty
      }
    }catch(e){}
  }
}

/* ============================ LOOP ============================ */
function loop(now){requestAnimationFrame(loop);blink=(blink+1)%60;
  pollPads();
  if(GS==='play'){
    if(hitstop>0)hitstop--;
    else{
      const all=[...heroes,...foes];
      for(const h of heroes){let inp;
        if(h.input===1)inp=edge(readInput(1),'1');
        else inp=h.cpu?cpuAlly(h):edge(readInput(2),'2');
        h.update(inp,all);}
      for(const f of foes)f.update(null,all);
      tickShots(all);tickFX();tickWar(stage);spawnTick();
      // revive proximity
      for(const h of heroes){if(!h.down)continue;
        for(const o of heroes){if(o===h||o.down||o.dead)continue;
          if(Math.abs(o.x-h.x)<60){h.reviveP=(h.reviveP||0)+1;
            if(h.reviveP>90){h.down=false;h.dead=false;h.hp=Math.ceil(h.maxhp*0.5);h.state='idle';h.reviveP=0;announce(h.cfg.pilot+' BACK UP');}}}}
      // cull dead foes
      for(let i=foes.length-1;i>=0;i--)if(foes[i].dead)foes.splice(i,1);
      // wave / theater progression
      if(!foes.length&&!spawnQ.length){
        if(gameMode==='seek'){nextSeekWave();announce('WAVE '+seekWave);}
        else if(waveIdx<stage.waves.length-1){waveIdx++;loadWave();announce('WAVE '+(waveIdx+1));}
        else if(theaterIdx<THEATERS.length-1){theaterIdx++;GS='briefing';}
        else{GS='win';unlocks.normal=true;unlocks.jail=true;
          if(DIFFS[diffIdx].n==='HARDEST')unlocks.hardest=true;saveUnlocks();}
      }
      // squad wipe?
      if(heroes.every(h=>h.down||h.dead)){GS='gameover';}
    }
  }
  if(barkT>0)barkT--;if(bannerT>0)bannerT--;if(hud.flash>0)hud.flash--;
  render(now);
}

/* ============================ RENDER ============================ */
function render(t){
  X.save();
  if(shake>0){X.translate((rnd()-0.5)*shake,(rnd()-0.5)*shake);shake*=0.85;if(shake<0.4)shake=0;}
  if(GS==='title'){drawTitle(t);X.restore();return;}
  if(GS==='select'){drawSelect(t);X.restore();return;}
  if(GS==='briefing'){drawBriefing(t);X.restore();return;}
  drawWar(t,stage);
  const order=[...heroes,...foes].filter(a=>!a.dead).sort((a,b)=>a.y-b.y);
  for(const f of order){if(f.flash>0&&f.flash%2)continue;drawMech(f);}
  drawShots();drawFX();drawHUD();
  if(hud.flash>0){X.fillStyle=`rgba(255,40,40,${hud.flash/20})`;X.fillRect(0,0,W,H);}
  if(GS==='win'||GS==='gameover')drawEnd();
  X.restore();
}
function drawHUD(){
  let y=18;for(const h of heroes){
    X.fillStyle='#000';X.fillRect(18,y-2,224,16);
    X.fillStyle='#3a0d0d';X.fillRect(20,y,200,12);
    X.fillStyle=h.down?'#555':(h.hp>30?'#4ade80':'#ff4d4d');X.fillRect(20,y,200*h.hp/h.maxhp,12);
    X.fillStyle='#000';X.fillRect(20,y+13,200,4);
    X.fillStyle=h.cfg.meter==='fire'?(h.meter>=100?'#ff3b2f':'#ff7a1a'):(h.meter>=100?'#b14bff':'#7fd0ff');
    X.fillRect(20,y+13,200*h.meter/100,4);
    X.fillStyle='#cfd6e0';X.font='11px "Courier New"';X.textAlign='left';
    X.fillText(h.cfg.suit+' · '+h.cfg.pilot+(h.down?'  [DOWN]':(h.meter>=100?'  ★READY':'')),20,y-6);
    if(h.down){X.fillStyle='#ffcf33';X.fillText('REVIVE: stand close',230,y+8);}
    y+=44;
  }
  X.textAlign='right';X.fillStyle='#fff';X.font='bold 16px "Courier New"';
  X.fillText('SCORE '+score,W-20,28);
  X.fillStyle=stage.accent;X.font='12px "Courier New"';
  X.fillText(gameMode==='seek'?('SEEK & DESTROY · WAVE '+seekWave):(stage.name.split('—')[0].trim()+'  ·  WAVE '+(waveIdx+1)+'/'+stage.waves.length),W-20,48);
  // remaining foes
  X.fillText('HOSTILES: '+(foes.length+spawnQ.length),W-20,66);
  if(barkT>0){X.globalAlpha=Math.min(1,barkT/30);X.fillStyle=stage.accent;
    X.font='bold 18px "Courier New"';X.textAlign='center';X.fillText('♪ '+bark+' ♪',W/2,H-22);X.globalAlpha=1;}
  X.textAlign='left';
}

/* ---- TITLE (deploying from the Lunar Crawler) ---- */
function drawTitle(t){drawWar(t,THEATERS[0]);tickWar(THEATERS[0]);
  drawCrawler(W/2,GROUND-6,1);
  X.fillStyle='rgba(5,7,13,.4)';X.fillRect(0,0,W,H);
  X.textAlign='center';X.fillStyle='#fff';X.font='bold 50px "Courier New"';X.fillText('FOG AND FIRE',W/2,170);
  X.fillStyle=THEATERS[0].accent;X.font='bold 26px "Courier New"';X.fillText('THE LUNAR PACT',W/2,210);
  X.fillStyle='#7fd0ff';X.font='13px "Courier New"';
  X.fillText('1–2 PLAYER CO-OP · the squad deploys from the LUNAR CRAWLER',W/2,242);
  X.fillStyle='#9fb0bd';X.font='12px "Courier New"';
  X.fillText('See it with your own two eyes. The hive says obey.',W/2,266);
  if(blink<38){X.fillStyle='#fff';X.font='bold 18px "Courier New"';X.fillText('[ENTER] TO DEPLOY',W/2,350);}
  X.fillStyle='#48505e';X.font='12px "Courier New"';X.fillText('ANDERS & PARTNERS LLC · A CASTLE KILLSCREEN TITLE',W/2,H-30);
  X.textAlign='left';}
function drawCrawler(cx,cy,a){X.save();X.globalAlpha=a;X.translate(cx,cy);
  X.fillStyle='#10141c';X.fillRect(-260,-70,520,70);          // hull
  X.fillStyle='#0a0d14';for(let i=-250;i<250;i+=46){X.beginPath();X.arc(i,2,16,0,7);X.fill();} // treads
  X.fillStyle='#1a2230';X.fillRect(-230,-96,180,30);           // command block
  X.fillStyle='#7fd0ff';X.globalAlpha=a*.5;X.fillRect(-220,-90,160,8); // cockpit glow
  X.globalAlpha=a;X.fillStyle='#252e3e';X.fillRect(40,-92,200,26); // launch deck
  for(let i=0;i<3;i++){X.fillStyle='#39465a';X.fillRect(70+i*60,-110,30,20);} // hangared mech tops
  X.restore();}

/* ---- SELECT ---- */
function drawSelect(t){drawWar(t,THEATERS[0]);tickWar(THEATERS[0]);
  X.fillStyle='rgba(5,7,13,.62)';X.fillRect(0,0,W,H);
  X.textAlign='center';X.fillStyle='#fff';X.font='bold 22px "Courier New"';X.fillText('CHOOSE YOUR PILOT',W/2,38);
  X.font='12px "Courier New"';X.fillStyle='#9fb0bd';
  X.fillText('[X] DIFFICULTY: '+DIFFS[diffIdx].n+'       [V] MODE: '+(gameMode==='seek'?'SEEK & DESTROY':'CAMPAIGN'),W/2,56);
  const cols=4,cw=104,ch=80,gx=(W-cols*cw)/2,gy=66;
  for(let i=0;i<PILOTS.length;i++){const r=PILOTS[i],cx=gx+(i%cols)*cw,cy=gy+((i/cols)|0)*ch;
    X.fillStyle='rgba(14,22,40,.7)';X.fillRect(cx+4,cy+4,cw-8,ch-8);
    X.save();X.translate(cx+cw/2,cy+ch-14);X.scale(0.4,0.4);
    drawMech({cfg:r,x:0,y:0,face:1,state:'idle',animT:t*0.05,atkT:0,id:r.id,meter:0});X.restore();
    if(i===selIdx){X.strokeStyle='#7fd0ff';X.lineWidth=3;X.strokeRect(cx+4,cy+4,cw-8,ch-8);}
    if(coop&&i===selP2){X.strokeStyle='#ff5bc8';X.lineWidth=2;X.strokeRect(cx+7,cy+7,cw-14,ch-14);}
    X.fillStyle=r.col[1];X.font='9px "Courier New"';X.textAlign='center';X.fillText(r.suit,cx+cw/2,cy+15);
    if(locked(r)){X.fillStyle='rgba(4,5,9,.74)';X.fillRect(cx+4,cy+4,cw-8,ch-8);
      X.fillStyle='#ffcf33';X.font='bold 11px "Courier New"';X.fillText('LOCKED',cx+cw/2,cy+ch/2);
      X.font='9px "Courier New"';X.fillStyle='#9fb0bd';
      X.fillText(r.lock==='hardest'?'HARDEST':r.lock==='jailbreak'?'JAILBREAK':'NORMAL',cx+cw/2,cy+ch/2+14);}}
  const cur=PILOTS[selIdx];
  X.fillStyle='rgba(0,0,0,.5)';X.fillRect(40,H-78,W-80,60);
  X.textAlign='left';X.fillStyle='#fff';X.font='bold 14px "Courier New"';
  X.fillText('P1 ▸ '+cur.suit+' ['+cur.arch+'] · '+cur.pilot,52,H-56);
  X.fillStyle=locked(cur)?'#ffcf33':'#9fb0bd';X.font='12px "Courier New"';
  X.fillText(locked(cur)?('LOCKED — '+(cur.lock==='hardest'?'beat the game on HARDEST':cur.lock==='jailbreak'?'jailbreak: beat the game':'beat the game on NORMAL')):cur.blurb,52,H-38);
  X.fillStyle=cur.col[1];X.font='11px "Courier New"';
  X.fillText('SPECIAL: '+cur.spec+'  ('+(cur.meter==='fire'?'HYDRAZINE — burns the pilot':'WAVE DEVICE')+')',52,H-22);
  X.textAlign='right';X.fillStyle='#7fd0ff';X.font='11px "Courier New"';
  X.fillText('[C] CO-OP: '+(coop?'ON (A/D pick P2)':'OFF')+'   [ENTER] '+(locked(cur)?'— LOCKED —':'DEPLOY'),W-52,H-22);
  X.textAlign='left';}

/* ---- BRIEFING ---- */
function drawBriefing(t){const s=THEATERS[theaterIdx];stage=s;seedWar(s);fog=s.fog||0.2;
  drawWar(t,s);tickWar(s);
  X.fillStyle='rgba(5,7,13,.5)';X.fillRect(0,0,W,H);
  drawCrawler(W/2,GROUND-6,0.5);
  X.textAlign='center';
  X.fillStyle='#9fb0bd';X.font='13px "Courier New"';X.fillText('THEATER '+(theaterIdx+1)+' / '+THEATERS.length,W/2,150);
  X.fillStyle=s.accent;X.font='bold 30px "Courier New"';X.fillText(s.name,W/2,196);
  X.fillStyle='#cfd6e0';X.font='15px "Courier New"';X.fillText(s.sub,W/2,232);
  X.fillStyle='#7fd0ff';X.font='12px "Courier New"';
  X.fillText('Squad: '+heroes.map(h=>h.cfg.pilot).join(' + '),W/2,270);
  if(blink<40){X.fillStyle='#fff';X.font='bold 16px "Courier New"';X.fillText('[ENTER] DROP IN',W/2,340);}
  X.textAlign='left';}

/* ---- END ---- */
function drawEnd(){X.fillStyle='rgba(0,0,0,.6)';X.fillRect(0,H/2-70,W,140);
  X.fillStyle=GS==='win'?'#4ade80':'#ff4d4d';X.fillRect(0,H/2-70,W,3);X.fillRect(0,H/2+67,W,3);
  X.textAlign='center';X.fillStyle='#fff';X.font='bold 34px "Courier New"';
  X.fillText(GS==='win'?'THE SQUAD HOLDS THE LINE':'SQUAD DOWN',W/2,H/2-16);
  X.fillStyle='#9fb0bd';X.font='14px "Courier New"';
  X.fillText(GS==='win'?'You saw it with your own two eyes.':'The fog took them.',W/2,H/2+14);
  X.fillStyle='#fff';X.fillText('SCORE '+score+'   ·   [ENTER] redeploy',W/2,H/2+44);
  X.textAlign='left';}

requestAnimationFrame(loop);
</script>
